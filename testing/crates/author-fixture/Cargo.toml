[package]
name = "daedalus-author-fixture"
description = "A tiny backend body macro, so the node macro can be tested without a real backend."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = ["std"]
std = ["daedalus-registry/std", "daedalus-types/alloc"]

[package.metadata.daedalus]
heap_free = true

[dependencies]
daedalus-derive = { path = "../../../core/derive" }
daedalus-macros = { path = "../../../core/macros" }
daedalus-registry = { path = "../../../core/registry", default-features = false }
daedalus-types = { path = "../../../core/types", default-features = false }

[lints]
workspace = true
