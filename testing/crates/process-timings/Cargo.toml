[package]
name = "daedalus-process-timings"
description = "The process backend's one-node round trip through a worker, which G4 records on a board. Run by hand, not in the gate."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
daedalus = { path = "../../../core/daedalus", features = ["std"] }
daedalus-abi = { path = "../../../core/abi", features = ["count-alloc", "test-run"] }
daedalus-backend = { path = "../../../core/backend" }
daedalus-backend-process = { path = "../../../backends/process" }
daedalus-cpu = { path = "../../../backends/cpu" }
daedalus-cpu-author = { path = "../../../backends/cpu-author" }
daedalus-lang-rust = { path = "../../../languages/rust" }
daedalus-macros = { path = "../../../core/macros" }
daedalus-registry = { path = "../../../core/registry" }
daedalus-runner = { path = "../../../core/runner" }
daedalus-types = { path = "../../../core/types" }
daedalus-wire = { path = "../../../core/wire" }
daedalus-worker-conformance = { path = "../worker-conformance" }

[[bin]]
name = "daedalus-sweep-worker"
path = "src/bin/sweep-worker.rs"

[lints]
workspace = true
