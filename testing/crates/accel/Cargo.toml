[package]
name = "daedalus-accel"
description = "Acceleration inventory: kernels register per op and backend, conformance tests record CI evidence, and a generator writes the backend matrix."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["simd", "gpu", "conformance", "inventory"]
categories = ["development-tools::testing", "no-std"]

[lints]
workspace = true

[package.metadata.daedalus]
boundary-features = []
host-only-features = ["std", "generator"]

[features]
default = []
# Runtime backend detection, `conform` (records evidence) and `dump`.
std = []
# The `accel-matrix` generator and gate.
generator = ["std"]

[dependencies]
