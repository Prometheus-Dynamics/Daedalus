[package]
name = "daedalus-worker-conformance"
description = "The canonical worker fixtures, and a runner that drives any worker spec through the process backend."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
daedalus-abi = { path = "../../../core/abi", features = ["test-run"] }
daedalus-backend = { path = "../../../core/backend" }
daedalus-backend-process = { path = "../../../backends/process" }
daedalus-registry = { path = "../../../core/registry" }
daedalus-runner = { path = "../../../core/runner", features = ["std"] }
daedalus-types = { path = "../../../core/types" }
daedalus-wire = { path = "../../../core/wire" }

[lints]
workspace = true

# The self-check worker: wrong in one named way when DAEDALUS_SABOTAGE names a behaviour.
[[bin]]
name = "daedalus-worker-sabotage"
path = "src/bin/sabotage.rs"
