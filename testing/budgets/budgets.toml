# The one table of budgets. `scripts/ci.sh budgets` measures every row it can on the machine it
# runs on and fails on a row above its limit. testing/budgets/README.md says what each field is
# and where each of the design's budgets is checked.
#
# To change a limit, change it here and give the reason in the commit message.

# --- Instruction counts: valgrind's callgrind (Ir) on a release build. -------------------------
# `command` is run twice, with {n} = 1000 and 3000, and the row's value is the difference in Ir
# divided by 2000, so building the graph cancels out. `dev_callgrind` is dev measured the same
# way and is the limit. `dev_perf` is dev's own figure, from `perf stat -e instructions:u`, kept
# for reference only. `next` is this branch when the row was last set, and the row also fails
# when it is more than `tolerance_percent` above that.

[[row]]
name = "idle_tick_16"
measure = "instructions per idle tick of a 16-stage graph"
tool = "callgrind"
command = "idle {n} 16"
dev_perf = 27064
dev_callgrind = 25988
limit = 25988
next = 151
tolerance_percent = 10

[[row]]
name = "plugin_node_tick"
measure = "instructions per tick of a one-node graph whose node is a dylib plugin's: feed, tick, take"
tool = "callgrind"
command = "plugin {n} {fixture}"
# Dev's figure is per stable-ABI node. The whole tick was 14,425 on the stable path and 10,655
# with the same node installed statically, so the node itself was 3,770 under callgrind.
dev_perf = 3100
dev_callgrind = 14425
limit = 14425
next = 3141
tolerance_percent = 10

[[row]]
name = "detector_frame"
measure = "instructions per frame of the detector-shaped graph: five stages, the input fanned out to four"
tool = "callgrind"
command = "detector {n}"
# Dev's figure for this graph is a time, about 7 us per frame, which is a board run. Its
# instruction count under perf was 32,046 to 32,480.
dev_perf = 32480
dev_callgrind = 34395
limit = 34395
next = 7701
tolerance_percent = 10
board_run = "I2"

[[row]]
name = "fused_chain_16_tick"
measure = "instructions per tick of 16 fused no-op stages with a value in them: feed, tick, take"
tool = "callgrind"
command = "chain {n} 16"
# Dev has no fused chain of plain numbers. Its 16-stage chain of frames was 35,717 under perf,
# which is the reference here and the limit.
dev_perf = 35717
limit = 35717
next = 8351
tolerance_percent = 10
board_run = "I2"

# --- Allocations: a counting global allocator in the harness. -----------------------------------
# The value is allocations per steady-state tick, over 1,000 ticks after a warm-up. Planning is
# not counted, and neither is making the value that is fed.

[[row]]
name = "alloc_fused_tick"
measure = "allocations per tick of 16 fused stages"
tool = "alloc"
dev = 0
limit = 0

[[row]]
name = "alloc_plugin_node_tick"
measure = "allocations per tick of a dylib plugin's node"
tool = "alloc"
dev = 0
limit = 0

[[row]]
name = "alloc_large_handle_tick"
measure = "allocations per tick of a graph that passes a megabyte by handle to two readers"
tool = "alloc"
dev = 0
limit = 0

[[row]]
name = "alloc_large_handle_moved_tick"
measure = "allocations per tick when a node takes the megabyte's handle and hands it on"
tool = "alloc"
dev = 0
# The node takes `Arc<Big>` and returns it. A node that takes `Big` itself and returns one has
# the result put behind a new handle, which is one allocation: the handoff rows hold that.
limit = 0

[[row]]
name = "alloc_detector_frame"
measure = "allocations per frame of the detector-shaped graph"
tool = "alloc"
dev = 0
# Zero. The graph's outputs, including the three the host reads, are kept for reuse by their
# producer. A host that takes a value with `take_value` or `take_copy` takes no copy; a host
# typed `take::<T>` copies a value that the producer still holds (see docs/design.md).
limit = 0

# --- Flash and static RAM: ELF section sizes of the five-node firmware. ---------------------------
# Flash is .vector_table + .text + .rodata + .data. RAM is .data + .bss + .uninit. The design's
# range, measured on dev, is 3 to 12 KiB of flash and 112 to 584 B of RAM across the three modes.
# It is not known per mode, so the rows carry limits and no dev value.

[[row]]
name = "firmware_compiled"
measure = "flash and RAM of the five-node firmware, compiled mode"
tool = "elf"
binary = "daedalus-chip-blink"
targets = ["thumbv7em-none-eabihf", "thumbv6m-none-eabi"]
limit_flash = 12288
limit_ram = 584

[[row]]
name = "firmware_tunable"
measure = "flash and RAM of the five-node firmware, tunable mode"
tool = "elf"
binary = "daedalus-chip-blink-tunable"
targets = ["thumbv7em-none-eabihf", "thumbv6m-none-eabi"]
limit_flash = 6144
limit_ram = 512

[[row]]
name = "firmware_loaded"
measure = "flash and RAM of the five-node firmware, loaded mode"
tool = "elf"
binary = "daedalus-chip-blink-loaded"
targets = ["thumbv7em-none-eabihf", "thumbv6m-none-eabi"]
# Above the design's 12 KiB. docs/chips.md says what the space is, and D7 set this limit.
limit_flash = 17920
limit_ram = 584

# --- Large-value handoff (I3): three ways to pass a large value, on the same graphs. --------------
# `read` is the host's value read through a reference by 8 nodes. `chain` is the value taken out
# of its handle and returned by 8 stages, then read once. The paths are a struct that owns its bytes (handle),
# reference-counted bytes (shared) and a stage that makes its own vector (vec), in
# testing/crates/handoff-bench. Dev has no figure for these under callgrind: its handoff numbers
# are times, which are a board run. So each instruction row's limit is this branch plus 10%.
# A chain row is fed a new 4 KiB value each tick, since its stages take the value, and making
# it is in the count for every path alike.

[[row]]
name = "handoff_handle_read_tick"
measure = "instructions per tick: a 4 KiB value passed as a handle, read by 8 nodes"
tool = "callgrind"
command = "handoff {n} handle readers"
limit = 10033
next = 9121
tolerance_percent = 10
board_run = "I3"

[[row]]
name = "handoff_handle_chain_tick"
measure = "instructions per tick: a 4 KiB value passed as a handle, handed on through 8 stages"
tool = "callgrind"
command = "handoff {n} handle chain"
limit = 12893
next = 11721
tolerance_percent = 10
board_run = "I3"

[[row]]
name = "handoff_shared_read_tick"
measure = "instructions per tick: a 4 KiB value passed as a shared, read by 8 nodes"
tool = "callgrind"
command = "handoff {n} shared readers"
limit = 10079
next = 9163
tolerance_percent = 10
board_run = "I3"

[[row]]
name = "handoff_shared_chain_tick"
measure = "instructions per tick: a 4 KiB value passed as a shared, handed on through 8 stages"
tool = "callgrind"
command = "handoff {n} shared chain"
limit = 13957
next = 12689
tolerance_percent = 10
board_run = "I3"

[[row]]
name = "handoff_vec_read_tick"
measure = "instructions per tick: a 4 KiB value passed as a vec, read by 8 nodes"
tool = "callgrind"
command = "handoff {n} vec readers"
limit = 10033
next = 9121
tolerance_percent = 10
board_run = "I3"

[[row]]
name = "handoff_vec_chain_tick"
measure = "instructions per tick: a 4 KiB value passed as a vec, handed on through 8 stages"
tool = "callgrind"
command = "handoff {n} vec chain"
limit = 19162
next = 17420
tolerance_percent = 10
board_run = "I3"

[[row]]
name = "alloc_handoff_handle_read_tick"
measure = "allocations per tick: a megabyte passed as a handle, read by 8 nodes"
tool = "alloc"
limit = 0

[[row]]
name = "alloc_handoff_handle_chain_tick"
measure = "allocations per tick: a megabyte passed as a handle, handed on through 8 stages"
tool = "alloc"
# Nothing a stage. A CPU node that takes a value and returns one refills a cell of its own, so a
# warm chain allocates nothing. The bytes are never copied.
limit = 0

[[row]]
name = "alloc_handoff_shared_read_tick"
measure = "allocations per tick: a megabyte passed as a shared, read by 8 nodes"
tool = "alloc"
limit = 0

[[row]]
name = "alloc_handoff_shared_chain_tick"
measure = "allocations per tick: a megabyte passed as a shared, handed on through 8 stages"
tool = "alloc"
# Nothing a stage. A value is moved from stage to stage, and each stage refills a cell of its own. The bytes' own count is never raised.
limit = 0

[[row]]
name = "alloc_handoff_vec_read_tick"
measure = "allocations per tick: a megabyte passed as a vec, read by 8 nodes"
tool = "alloc"
limit = 0

[[row]]
name = "alloc_handoff_vec_chain_tick"
measure = "allocations per tick: a megabyte passed as a vec, handed on through 8 stages"
tool = "alloc"
# The contrast: each stage makes its own vector, one allocation a stage, and copies the bytes.
# The stage keeps nothing of its own, so only the vector it makes is counted.
limit = 8

# `handed` is the same chain of 8 stages, each taking the value's handle (`Arc<T>`) and
# returning it. Nothing is allocated, on any path: the value never leaves its handle.

[[row]]
name = "handoff_handle_handed_tick"
measure = "instructions per tick: a 4 KiB value passed as a handle, its handle handed on through 8 stages"
tool = "callgrind"
command = "handoff {n} handle handed"
