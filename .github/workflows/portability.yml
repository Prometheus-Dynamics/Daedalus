name: Portability

on:
  push:
    branches:
      - next
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE-*"
  pull_request:
    branches:
      - next
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross:
    runs-on: ubuntu-latest
    # A hung step fails here, not at the runner's six-hour limit.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Pull requests restore next's caches and save none: their own would only push next's
          # out of the repository's cache space.
          save-if: ${{ github.ref == 'refs/heads/next' }}
      - run: rustup target add aarch64-unknown-linux-gnu armv7-unknown-linux-musleabihf riscv64gc-unknown-linux-gnu riscv64gc-unknown-linux-musl
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - run: ./scripts/apt-install.sh qemu-user libc6-riscv64-cross
      - run: ./scripts/cross.sh

  # Known red, not hidden. One failure is known here:
  #   - `daedalus-lang-cpp --test native`: a consumer built with MSVC against the installed C++ SDK
  #     doesn't compile (`std::string_view`, `std::optional` and `daedalus_status_t` undeclared in
  #     the installed daedalus_host.hpp); likely the installed package doesn't pass C++17 on to
  #     its consumers. A product fault, held for a decision on the C and C++ SDKs.
  # Remove an entry when its fix lands.
  windows:
    runs-on: windows-latest
    # A hung step fails here, not at the runner's six-hour limit.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Pull requests restore next's caches and save none: their own would only push next's
          # out of the repository's cache space.
          save-if: ${{ github.ref == 'refs/heads/next' }}
      # The Java SDK builds with `javac --release 21`. The runner image carries JDK 21; point at it.
      - name: JDK 21
        shell: bash
        run: |
          test -n "$JAVA_HOME_21_X64" || { echo "the runner image has no JDK 21" >&2; exit 1; }
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets --no-fail-fast
