name: Package

on:
  push:
    branches:
      - next
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE-*"
  pull_request:
    branches:
      - next
  workflow_dispatch:

# The steps' bounds were measured on a 32-core machine; the hosted runners are slower.
env:
  DAEDALUS_BOUND_SCALE: "4"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    # A hung step fails here, not at the runner's six-hour limit.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          # The semver step compares against a tag, when there is one.
          fetch-depth: 0
      # rust-toolchain.toml's pin, and no other toolchain (see the action).
      - uses: ./.github/actions/rust-pin
      - uses: Swatinem/rust-cache@v2
        with:
          # Pull requests restore next's caches and save none: their own would only push next's
          # out of the repository's cache space.
          save-if: ${{ github.ref == 'refs/heads/next' }}
          # scripts/ci.sh builds with scripts/home-remap.sh's flags, set as it runs, where
          # rust-cache can't see them: a change to them moves the key, so no cache of builds made
          # with other flags is restored and rebuilt on every run.
          key: ${{ hashFiles('scripts/home-remap.sh') }}
      # Every publishable crate lists its files with no warning.
      - run: ./scripts/ci.sh package
      # Reports against the last release. Does nothing until there is one.
      - run: ./scripts/ci.sh semver
      # A build leaves nothing in the tree that git doesn't ignore.
      - run: cargo build --locked --workspace
      - run: ./scripts/repo-clean.sh
