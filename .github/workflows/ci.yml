name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

env:
  # CI builds are one-shot: incremental artifacts only cost time and cache space.
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

# Jobs are grouped by the crate graphs they compile (feature set and mode), so no two jobs build
# the same graph and each job's cache holds only its own.
jobs:
  # Lints, the workspace tests (`engine,plugins`, dev build) and the CPU-only example binaries,
  # which reuse that graph, then the all-features library build (linking every `cdylib`).
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@v5

      # The same release as rust-toolchain.toml (and the MSRV): installing it here gives the
      # pinned toolchain the components and targets below.
      - &toolchain-lint
        name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy

      # For the styx camera example feature (`--all-features`).
      - &libcamera
        name: Install native camera dependencies
        run: sudo apt-get update && sudo apt-get install -y libcamera-dev pkg-config

      # Pull requests restore the newest cache of the default branch but do not save their own,
      # so they cannot evict it (one cache per job).
      - &cache
        name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

      - name: Run lints (file sizes, workspace deps, GPU async, rustfmt)
        run: ./scripts/ci.sh lints

      - name: Run workspace tests
        run: cargo test --workspace --all-targets --features "engine,plugins"

      - name: Run CPU-only example binaries
        run: ./scripts/ci.sh smoke

      # `check` and clippy do not link: this catches `cdylib` plugins whose exported symbols clash
      # under feature unification.
      - name: Build all features
        run: ./scripts/ci.sh link

  # The facade alone: native `cdylib` plugin loading, then the trybuild macro UI tests (`plugins`
  # only, ignored in the regular test run; trybuild compiles its own project).
  facade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - *checkout
      - &toolchain
        name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0
      - *cache

      - name: Test dynamic plugin loading
        run: cargo test -p daedalus-rs --features "engine,plugins,dylib-plugins"

      - name: Run macro UI (trybuild) tests
        run: ./scripts/ci.sh macro-ui

  # Everything in check mode: clippy for `engine,plugins`, dylib plugins and all features, the
  # per-package feature surfaces and rustdoc.
  docs-and-lints:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - *checkout
      - *toolchain-lint
      - *libcamera
      - *cache

      - name: Run clippy (engine,plugins; dylib plugins; all features)
        run: ./scripts/ci.sh clippy

      - name: Check feature surfaces
        run: ./scripts/ci.sh features

      - name: Build docs (-D warnings)
        run: ./scripts/ci.sh doc

  # `cargo package --no-verify` compiles nothing, so this job has no Rust cache.
  package-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - *checkout
      - *toolchain

      - name: Validate package surface
        run: cargo package --workspace --exclude daedalus-rs --exclude daedalus-examples --exclude daedalus-plugins-math --exclude daedalus-plugins-example-project --exclude daedalus-plugins-framelease --exclude daedalus-wasm-smoke --exclude daedalus-wasm-bindgen-host --exclude daedalus-nostd-smoke --exclude daedalus-mcu-blink --exclude daedalus-mcu-blink-nodes --exclude daedalus-plugins-dependent --exclude daedalus-plugins-foreign-consumer --exclude daedalus-plugins-example-project-dylib --exclude daedalus-plugins-stable-abi --exclude daedalus-frame-bench --allow-dirty --no-verify

  # Type-check only (no linking): the C cross compiler is for build scripts that compile C.
  aarch64:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - *checkout
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: aarch64-unknown-linux-gnu,aarch64-unknown-linux-musl
      - *cache
      - name: Install aarch64 C cross compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Check aarch64 (default, embedded, gpu-dmabuf)
        run: ./scripts/ci.sh aarch64

  # Workspace tests unify the daemon crate's executor-pool/metrics features into every crate;
  # this job tests the facade/engine/runtime without them.
  lean-preset:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - *checkout
      - *toolchain
      - *cache
      - name: Test lean preset (no executor pool, no metrics)
        run: ./scripts/ci.sh lean

  # no_std + alloc check of the tier-1 crates on bare metal (with and without compare-and-swap)
  # and of the serial runtime and engine (plus the no_std smoke graph run natively), the MCU
  # profile firmware against its size budgets, and the embedded preset on wasm32-unknown-unknown
  # and wasm32-wasip1: built (dev profile), then run in Node (preinstalled on the runner),
  # including the wasm-bindgen host example.
  portability:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - *checkout
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: thumbv7em-none-eabihf,thumbv6m-none-eabi,wasm32-unknown-unknown,wasm32-wasip1
      # The CLI must match the `wasm-bindgen` version in Cargo.lock (`scripts/ci.sh wasm` checks).
      - name: Read wasm-bindgen version from Cargo.lock
        id: wasm-bindgen
        run: echo "version=$(sed -n '/^name = "wasm-bindgen"$/{n;s/^version = "\(.*\)"$/\1/p}' Cargo.lock)" >> "$GITHUB_OUTPUT"
      - name: Install wasm-bindgen CLI
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}
      - *cache
      - name: Check no_std crates; build and run the wasm embedded preset
        run: ./scripts/ci.sh nostd wasm

      # Builds the MCU blink firmware for both bare-metal targets, fails above its flash/RAM
      # budgets (`readelf`), and runs the MCU crates' native tests (docs/mcu.md).
      - name: Build and measure the MCU profile firmware
        run: ./scripts/ci.sh mcu
