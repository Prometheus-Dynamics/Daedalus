name: Next

on:
  push:
    branches:
      - next
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE-*"
  pull_request:
    branches:
      - next
  workflow_dispatch:

# The steps' bounds were measured on a 32-core machine; the hosted runners are slower.
env:
  DAEDALUS_BOUND_SCALE: "4"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    # A hung step fails here, not at the runner's six-hour limit.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # rust-toolchain.toml selects the toolchain and its components.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Pull requests restore next's caches and save none: their own would only push next's
          # out of the repository's cache space.
          save-if: ${{ github.ref == 'refs/heads/next' }}
      - run: rustup target add thumbv7em-none-eabihf thumbv6m-none-eabi riscv32imac-unknown-none-elf wasm32-unknown-unknown wasm32-wasip1
      - id: wasm-bindgen
        run: echo "version=$(scripts/wasm-bindgen-version.sh)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ steps.wasm-bindgen.outputs.version }}
      # The Java SDK builds with `javac --release 21`. The runner image carries JDK 21; point at it.
      - name: JDK 21
        shell: bash
        run: |
          test -n "$JAVA_HOME_21_X64" || { echo "the runner image has no JDK 21" >&2; exit 1; }
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      - run: ./scripts/gate.sh
