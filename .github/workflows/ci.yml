name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

env:
  # CI builds are one-shot: incremental artifacts only cost time and cache space.
  CARGO_INCREMENTAL: 0
  # Line tables keep backtraces useful while shrinking debug binaries and link times.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_TERM_COLOR: always

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@v5

      - &toolchain-lint
        name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install native camera dependencies
        run: sudo apt-get update && sudo apt-get install -y libcamera-dev pkg-config

      - &cache
        name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run file-size lint
        run: ./scripts/check-file-sizes.sh

      - name: Run workspace dependency centralization lint
        run: ./scripts/check-workspace-deps.sh

      - name: Run GPU async blocking lint
        run: ./scripts/check-gpu-async-blocking.sh

      - name: Run workspace tests
        run: cargo test --workspace --all-targets --features "engine,plugins"

      - name: Check all features
        run: cargo check --workspace --all-targets --all-features

      # `check` does not link: this catches `cdylib` plugins whose exported symbols clash under
      # feature unification.
      - name: Build all features
        run: cargo build --workspace --lib --all-features

      - name: Check minimal facade surface
        run: cargo check -p daedalus-rs --no-default-features

      - name: Check lean and full engine presets
        run: |
          cargo check -p daedalus-rs --no-default-features --features "embedded"
          cargo check -p daedalus-rs --all-targets --features "engine-full,plugins"

      - name: Build examples
        run: cargo check -p daedalus-rs --features "engine,plugins" --examples

      - name: Run example tests
        run: cargo test -p daedalus-rs --features "engine,plugins" --examples

      - name: Run CPU-only example binaries
        run: ./scripts/ci.sh smoke

  # trybuild compiles its own project per UI test run, so it gets a job that runs in parallel
  # with the workspace tests (the test is `#[ignore]`d in the regular test run).
  macro-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - *checkout
      - &toolchain
        name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - *cache

      - name: Run macro UI (trybuild) tests
        run: cargo test -p daedalus-rs --features plugins --test transport_macro_ui -- --ignored

  dylib-plugins:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - *checkout
      - *toolchain
      - *cache

      - name: Test dynamic plugin loading
        run: cargo test -p daedalus-rs --features "engine,plugins,dylib-plugins"

  docs-and-lints:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - *checkout
      - *toolchain-lint
      - *cache

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --features "engine,plugins" -- -D warnings

      - name: Run clippy (dynamic plugin loading)
        run: cargo clippy -p daedalus-rs --all-targets --features "engine,plugins,dylib-plugins" -- -D warnings

      - name: Build docs
        run: cargo doc --workspace --no-deps

  package-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - *checkout
      - *toolchain
      - *cache

      - name: Validate package surface
        run: cargo package --workspace --exclude daedalus-rs --exclude daedalus-examples --exclude daedalus-plugins-math --exclude daedalus-plugins-example-project --exclude daedalus-plugins-framelease --exclude daedalus-wasm-smoke --allow-dirty --no-verify

  # Type-check only (no linking): the C cross compiler is for build scripts that compile C.
  aarch64:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - *checkout
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu,aarch64-unknown-linux-musl
      - *cache
      - name: Install aarch64 C cross compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Check aarch64 (default, embedded, gpu-dmabuf)
        run: ./scripts/ci.sh aarch64

  # Workspace tests unify the daemon crate's executor-pool/metrics features into every crate;
  # this job tests the facade/engine/runtime without them.
  lean-preset:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - *checkout
      - *toolchain
      - *cache
      - name: Test lean preset (no executor pool, no metrics)
        run: ./scripts/ci.sh lean

  # no_std + alloc check of the tier-1 crates on bare metal, and the embedded preset on
  # wasm32-unknown-unknown: type-checked, then run in Node (preinstalled on the runner).
  portability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - *checkout
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf,wasm32-unknown-unknown
      - *cache
      - name: Check no_std crates and the wasm embedded preset
        run: ./scripts/ci.sh nostd wasm
