name: bench

# Benchmark tracking: never runs on pull requests. Each run benches the head commit and the
# head commit of the previous bench run on the same branch (main or dev) in the same job, so both
# sides share one runner: hosted runners differ in speed by 15-40% between jobs, which made a
# compare against an earlier run's artifact flag every bench. The head's criterion output is
# uploaded as the `criterion` artifact; scripts/bench-compare.py flags a >15% median regression.
# A flagged bench is re-run twice more on both commits, alternating, and the job fails only if
# the median of the three runs per side still regresses: one noisy run no longer fails it.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  push:
    branches:
      - main
      - dev
    paths:
      - "crates/runtime/**"
      - "crates/engine/**"
      - "crates/transport/**"
      - "Cargo.lock"
      - ".github/workflows/bench.yml"
      - "scripts/bench-compare.py"

concurrency:
  group: bench
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  BENCH_ARTIFACT: criterion

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      # The previous bench run's head commit on this branch, benched here on the same runner.
      - name: Bench the previous baseline commit
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          mkdir -p baseline
          base=""
          # `gh run list` returns newest first; skip this run and any newer one.
          for row in $(gh run list --workflow bench.yml --branch "$BRANCH" --status completed \
              --limit 50 --json databaseId,headSha --jq '.[] | "\(.databaseId):\(.headSha)"'); do
            id=${row%%:*} sha=${row#*:}
            [ "$id" -ge "$GITHUB_RUN_ID" ] && continue
            [ "$sha" = "$GITHUB_SHA" ] && continue
            if git cat-file -e "$sha^{commit}" 2>/dev/null; then base=$sha; break; fi
          done
          if [ -z "$base" ]; then
            echo "No previous bench commit found; this run has nothing to compare against"
            exit 0
          fi
          echo "Baseline commit $base"
          git worktree add --detach ../bench-base "$base"
          # Its own target directory: cargo hashes path crates by their path relative to the
          # workspace root, so a shared one maps both checkouts to the same artifacts and the
          # head build then reuses the baseline's crates as fresh (3310894: the head plugin
          # compiled against the baseline runtime).
          (cd ../bench-base && CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target-base" ./scripts/ci.sh bench)
          cp -r target-base/criterion/. baseline/
          rm -rf target-base

      # Start from an empty criterion directory so only this run's estimates are uploaded.
      - name: Run benches
        run: rm -rf target/criterion && ./scripts/ci.sh bench

      - name: Upload criterion output
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BENCH_ARTIFACT }}
          path: target/criterion
          retention-days: 90

      - name: Compare against baseline
        run: |
          cp -r target/criterion current-0
          if python3 scripts/bench-compare.py baseline current-0 --threshold 15 \
              --regressions-out regressions.txt; then
            exit 0
          fi
          [ -d ../bench-base ] || exit 1
          # Confirm: re-run only the flagged benches, baseline and head alternating.
          filter=$(python3 scripts/bench-compare.py --filter-for regressions.txt)
          echo "Re-running $(wc -l < regressions.txt) flagged bench(es): $filter"
          for i in 1 2; do
            (cd ../bench-base && rm -rf "$GITHUB_WORKSPACE/target/criterion" \
              && BENCH_FILTER="$filter" CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" ./scripts/ci.sh bench)
            cp -r target/criterion "baseline-$i"
            rm -rf target/criterion && BENCH_FILTER="$filter" ./scripts/ci.sh bench
            cp -r target/criterion "current-$i"
          done
          python3 scripts/bench-compare.py baseline,baseline-1,baseline-2 \
            current-0,current-1,current-2 --threshold 15
