# /usr/lib/tmpfiles.d/daedalusd.conf: the directories the daemon reads.
d /etc/daedalusd 0755 root root -
d /usr/lib/daedalusd 0755 root root -
d /usr/lib/daedalusd/plugins 0755 root root -
# The socket's directory, owned by the service user from boot, so a client in the daedalusd
# group can reach the socket before the daemon has ever started.
d /run/daedalusd 0750 daedalusd daedalusd -
