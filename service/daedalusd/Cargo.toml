[package]
# The integration tests are listed below: see tests/all.rs.
autotests = false
name = "daedalusd"
description = "The Daedalus daemon: one host, served to clients over a unix socket, loopback TCP or stdio."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
daedalus-abi = { path = "../../core/abi", optional = true }
daedalus-backend = { path = "../../core/backend" }
daedalus-backend-process = { path = "../../backends/process", optional = true }
daedalus-host = { path = "../../core/host", default-features = false, features = ["listen"] }
daedalus-integrity = { path = "../../core/integrity" }
daedalus-loader = { path = "../../core/loader" }
daedalus-registry = { path = "../../core/registry" }
daedalus-types = { path = "../../core/types" }
daedalus-wire = { path = "../../core/wire" }
serde = { workspace = true, features = ["std"] }
signal-hook = { workspace = true }
toml = { workspace = true }

[features]
# Planning in the daemon: graphs are stored and planned here. Off, the daemon serves made plans only.
default = ["planner"]
planner = ["daedalus-host/planner"]
# Worker programs from the config: the process backend, which runs nodes written in other languages.
workers = ["dep:daedalus-abi", "dep:daedalus-backend-process"]

[target.'cfg(unix)'.dependencies]
listenfd = { workspace = true }

[dev-dependencies]
daedalus-client = { path = "../../core/client" }
# Its library is the second plugin of the two-plugin test: cargo builds it beside the test.
daedalus-fake-npu-plugin = { path = "../../testing/crates/fake-npu-plugin" }
daedalus-graph = { path = "../../core/graph" }

[lints]
workspace = true

[[test]]
name = "all"
path = "tests/all.rs"
