version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
daedalus-abi = { path = "../../core/abi", features = ["std"] }
daedalus-backend = { path = "../../core/backend" }
daedalus-runner = { path = "../../core/runner", features = ["std"] }
daedalus-types = { path = "../../core/types" }

[dev-dependencies]
daedalus-abi = { path = "../../core/abi", features = ["test-run"] }
daedalus-types = { path = "../../core/types" }

[lints]
workspace = true
