[package]
name = "daedalus-dmabuf"
description = "A backend that runs no nodes: blocks of shareable memory, a pool of them, and the moves to and from the CPU."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
daedalus-abi = { path = "../../core/abi" }
daedalus-backend = { path = "../../core/backend" }
daedalus-dma-sys = { path = "../dma-sys" }
daedalus-runner = { path = "../../core/runner" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
daedalus-abi = { path = "../../core/abi", features = ["count-alloc", "test-run"] }
daedalus-conformance = { path = "../../testing/crates/conformance" }
daedalus-types = { path = "../../core/types" }

[lints]
workspace = true
