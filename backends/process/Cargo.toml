[package]
# The integration tests are listed below: see tests/all.rs.
autotests = false
name = "daedalus-backend-process"
description = "The process backend: nodes served by a worker process that speaks the wire protocol."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
daedalus-abi = { path = "../../core/abi" }
daedalus-backend = { path = "../../core/backend" }
daedalus-integrity = { path = "../../core/integrity" }
daedalus-loader = { path = "../../core/loader" }
daedalus-registry = { path = "../../core/registry" }
daedalus-runner = { path = "../../core/runner", features = ["std"] }
daedalus-types = { path = "../../core/types" }
daedalus-value = { path = "../../core/value" }
daedalus-wire = { path = "../../core/wire" }
daedalus-process-shm = { path = "../process-shm" }
daedalus-worker-io = { path = "../../languages/worker-io" }

[target.'cfg(target_os = "linux")'.dependencies]
daedalus-dma-sys = { path = "../dma-sys" }
daedalus-dmabuf = { path = "../dmabuf" }

[dev-dependencies]
daedalus = { path = "../../core/daedalus", features = ["std"] }
daedalus-abi = { path = "../../core/abi", features = ["count-alloc", "test-run"] }
daedalus-cpu = { path = "../cpu" }
daedalus-cpu-author = { path = "../cpu-author" }
daedalus-runner = { path = "../../core/runner" }
daedalus-worker-conformance = { path = "../../testing/crates/worker-conformance" }

[lints]
workspace = true

[[test]]
name = "all"
path = "tests/all.rs"

# Its own process: counts this process's file descriptors.
[[test]]
name = "integrity"
path = "tests/integrity.rs"

# Its own process: installs its own global allocator, and counts the whole process's page faults.
[[test]]
name = "wire_steady"
path = "tests/wire_steady.rs"
