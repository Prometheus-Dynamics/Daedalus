[package]
name = "daedalus-vk-sys"
description = "The raw Vulkan and wgpu-hal calls of the GPU backend, in one place."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ash = { workspace = true }
wgpu = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
daedalus-abi = { path = "../../core/abi", features = ["count-alloc"] }
naga = { workspace = true }
pollster = { workspace = true }

[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"

[lints.clippy]
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
undocumented_unsafe_blocks = "deny"
