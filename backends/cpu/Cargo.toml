[package]
name = "daedalus-cpu"
description = "The CPU backend: typed Rust functions as steps."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["std", "merge"]
std = ["alloc", "daedalus-registry/std"]
alloc = [
    "dep:daedalus-backend",
    "dep:daedalus-graph",
    "dep:spin",
    "daedalus-abi/alloc",
    "daedalus-plan/alloc",
    "daedalus-runner/alloc",
    "daedalus-types/alloc",
    "daedalus-value/alloc",
]
# A region's nodes as direct calls (D2).
merge = []
# Blob form and its small runner (D3).
blob = ["chip-params"]
receive = ["blob"]
# Generated Rust for a solved region (D4).
source = ["std", "merge", "blob", "tunable"]
tunable = ["chip-params"]
# Bare-metal chips (D5).
chip = []
chip-params = ["chip"]
f64 = []
defmt = ["dep:defmt"]

[dependencies]
daedalus-abi = { path = "../../core/abi", default-features = false }
daedalus-backend = { path = "../../core/backend", optional = true }
daedalus-graph = { path = "../../core/graph", optional = true }
daedalus-plan = { path = "../../core/plan", default-features = false }
daedalus-registry = { path = "../../core/registry", default-features = false }
daedalus-runner = { path = "../../core/runner", default-features = false }
daedalus-types = { path = "../../core/types", default-features = false }
daedalus-value = { path = "../../core/value", default-features = false }
defmt = { workspace = true, optional = true }
spin = { workspace = true, optional = true }

[dev-dependencies]
daedalus-abi = { path = "../../core/abi", features = ["test-run", "count-alloc"] }
daedalus-cpu-author = { path = "../cpu-author" }
daedalus-macros = { path = "../../core/macros" }
daedalus-graph = { path = "../../core/graph" }
daedalus-host = { path = "../../core/host" }
daedalus-plan = { path = "../../core/plan" }
daedalus-planner = { path = "../../core/planner" }
daedalus-registry = { path = "../../core/registry" }

[lints]
workspace = true
