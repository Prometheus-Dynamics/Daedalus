[package]
name = "daedalus-wgpu"
description = "The wgpu backend: one device, opened on first use, behind the process-wide driver lock."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
daedalus-abi = { path = "../../core/abi" }
daedalus-backend = { path = "../../core/backend" }
daedalus-graph = { path = "../../core/graph" }
daedalus-kernels-sys = { path = "../kernels-sys" }
daedalus-registry = { path = "../../core/registry" }
daedalus-runner = { path = "../../core/runner" }
daedalus-types = { path = "../../core/types" }
daedalus-vk-sys = { path = "../vk-sys" }
pollster = { workspace = true }
wgpu = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
daedalus-dma-sys = { path = "../dma-sys" }

[dev-dependencies]
daedalus-abi = { path = "../../core/abi", features = ["count-alloc", "test-run"] }
daedalus-value = { path = "../../core/value" }

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
daedalus-dma-sys = { path = "../dma-sys" }
