[package]
# The integration tests are listed below: see tests/all.rs.
autotests = false
name = "daedalus-wgpu"
description = "The wgpu backend: one device, opened on first use, behind the process-wide driver lock."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
daedalus-abi = { path = "../../core/abi" }
daedalus-backend = { path = "../../core/backend" }
daedalus-graph = { path = "../../core/graph" }
daedalus-registry = { path = "../../core/registry" }
daedalus-runner = { path = "../../core/runner" }
daedalus-dmabuf = { path = "../dmabuf" }
daedalus-types = { path = "../../core/types" }
daedalus-vk-sys = { path = "../vk-sys" }
pollster = { workspace = true }
wgpu = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
daedalus-dma-sys = { path = "../dma-sys" }

[dev-dependencies]
daedalus-abi = { path = "../../core/abi", features = ["count-alloc", "test-run"] }
daedalus-value = { path = "../../core/value" }
daedalus-planner = { path = "../../core/planner" }
daedalus-made = { path = "../../core/made" }
daedalus-planner-tests = { path = "../../testing/crates/planner" }

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
daedalus-dma-sys = { path = "../dma-sys" }

[[test]]
name = "all"
path = "tests/all.rs"

# Its own process: counts this process's file descriptors.
[[test]]
name = "every_adapter"
path = "tests/every_adapter.rs"

# Its own process: sets the shared device's answer for read-only dma-bufs, which other tests read.
[[test]]
name = "import_refused"
path = "tests/import_refused.rs"

# Its own process: reads a count of the whole process (devices opened, live handles) that other tests move.
[[test]]
name = "planning"
path = "tests/planning.rs"

# Its own process: installs its own global allocator.
[[test]]
name = "region"
path = "tests/region.rs"

# Its own process: reads a count of the whole process (devices opened, live handles) that other tests move.
[[test]]
name = "shared"
path = "tests/shared.rs"

# Its own process: installs its own global allocator.
[[test]]
name = "storage"
path = "tests/storage.rs"

# Its own process: reads a count of the whole process (devices opened, live handles) that other tests move.
[[test]]
name = "stress"
path = "tests/stress.rs"
