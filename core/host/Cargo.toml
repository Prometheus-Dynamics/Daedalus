[package]
# The integration tests are listed below: see tests/all.rs.
autotests = false
name = "daedalus-host"
description = "The host around one loaded graph: feed, step, take and drain typed ports."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["std", "planner"]
# Snapshots of the state store, which need std. A host needs no planner to load a made plan.
std = ["daedalus-runner/std", "daedalus-value/std", "dep:serde", "dep:serde_json", "dep:daedalus-backend", "dep:daedalus-graph", "dep:daedalus-abi", "dep:daedalus-plan", "dep:daedalus-registry", "dep:daedalus-made"]
# Planning: a host plans a graph it is given. Off, the host loads only made plans.
planner = ["std", "dep:daedalus-planner"]
# The service listener: one host shared by many clients over a unix socket, loopback TCP or stdio.
listen = ["std", "dep:daedalus-wire", "daedalus-abi/count-alloc"]
# Allocation attribution through the counting allocator. Feature only.
alloc-probe = ["std", "dep:daedalus-abi", "daedalus-abi/count-alloc"]

[dependencies]
daedalus-abi = { path = "../abi", optional = true }
daedalus-backend = { path = "../backend", optional = true }
daedalus-graph = { path = "../graph", optional = true }
daedalus-plan = { path = "../plan", optional = true }
daedalus-planner = { path = "../planner", optional = true }
daedalus-made = { path = "../made", optional = true }
daedalus-registry = { path = "../registry", optional = true }
daedalus-runner = { path = "../runner" }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
daedalus-types = { path = "../types" }
daedalus-value = { path = "../value", default-features = false, features = ["alloc"] }
daedalus-wire = { path = "../wire", optional = true }

[dev-dependencies]
daedalus-client = { path = "../client" }
daedalus-abi = { path = "../abi", features = ["count-alloc"] }
daedalus-plan = { path = "../plan" }

[[test]]
name = "listen"
required-features = ["listen"]

[[test]]
name = "listen_wire"
required-features = ["listen"]

[[test]]
name = "listen_made"
required-features = ["listen"]

# Its own process: installs its own global allocator.
[[test]]
name = "socket_alloc"
# It stores a graph, which the host plans.
required-features = ["listen", "planner"]

[lints]
workspace = true

[[test]]
name = "all"
path = "tests/all.rs"

