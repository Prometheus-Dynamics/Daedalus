[package]
name = "daedalus-runner"
description = "Walks a solved step list with no heap: the tick loop, dirty bits, and slot queues."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["alloc"]
# Shared and typed payloads, which need the heap to be built.
alloc = ["daedalus-abi/alloc", "daedalus-value/alloc", "dep:spin"]
# Panics in bodies become faults instead of unwinding.
std = ["alloc", "daedalus-abi/std", "dep:libc"]
# The parallel lanes: a worker pool and the shared ready queue.
threads = ["std"]

[package.metadata.daedalus]
heap_free = true

[dependencies]
daedalus-abi = { path = "../abi", default-features = false }
daedalus-plan = { path = "../plan", default-features = false }
daedalus-value = { path = "../value", default-features = false }
spin = { workspace = true, optional = true }
daedalus-types = { path = "../types", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true, optional = true }

[dev-dependencies]
daedalus-runner = { path = ".", features = ["threads"] }
daedalus-abi = { path = "../abi", features = ["count-alloc", "test-run", "std"] }
daedalus-types = { path = "../types" }

# This crate calls step bodies through `Step::run`, so it may use unsafe.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
unused_attributes = "deny"

[lints.clippy]
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
