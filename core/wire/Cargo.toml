[package]
# The integration tests are listed below: see tests/all.rs.
autotests = false
name = "daedalus-wire"
description = "The worker wire protocol: framing, typed values and the worker messages."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
daedalus-abi = { path = "../abi" }
daedalus-types = { path = "../types" }

[dev-dependencies]
daedalus-abi = { path = "../abi", features = ["count-alloc"] }
daedalus-derive = { path = "../derive" }
daedalus-registry = { path = "../registry" }

[lints]
workspace = true

[[test]]
name = "all"
path = "tests/all.rs"

# Its own process: installs its own global allocator.
[[test]]
name = "alloc"
path = "tests/alloc.rs"
