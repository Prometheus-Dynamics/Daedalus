[package]
# The integration tests are listed below: see tests/all.rs.
autotests = false
name = "daedalus-derive"
description = "Derives for config types and named types."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }

[dev-dependencies]
daedalus-abi = { path = "../abi" }
daedalus-author-fixture = { path = "../../testing/crates/author-fixture" }
daedalus-macros = { path = "../macros" }
daedalus-registry = { path = "../registry" }
daedalus-types = { path = "../types" }
trybuild = { workspace = true }

[lints]
workspace = true

[[test]]
name = "all"
path = "tests/all.rs"

# Its own process: runs trybuild, which the runner keeps one at a time.
[[test]]
name = "ui"
path = "tests/ui.rs"
