[package]
name = "daedalus"
description = "The names an application needs from Daedalus. Re-exports only."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Everything that needs the operating system: loading a plan, reload, streams.
std = [
  "daedalus-host/std",
  "daedalus-runner/std",
  "dep:daedalus-graph",
  "dep:daedalus-planner",
  "dep:daedalus-registry",
]
# The runner's own names, for hosts that drive it directly.
runner = []
# Parallel lanes.
threads = ["std", "runner", "daedalus-runner/threads"]
# Allocation attribution through the counting allocator.
alloc-probe = ["std", "daedalus-host/alloc-probe"]

[dependencies]
daedalus-graph = { path = "../graph", optional = true }
daedalus-host = { path = "../host", default-features = false }
daedalus-derive = { path = "../derive" }
daedalus-macros = { path = "../macros" }
daedalus-planner = { path = "../planner", optional = true }
daedalus-registry = { path = "../registry", optional = true }
daedalus-runner = { path = "../runner" }
daedalus-types = { path = "../types" }
daedalus-value = { path = "../value" }

[lints]
workspace = true
