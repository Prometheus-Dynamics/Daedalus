[package]
name = "daedalus-capi"
description = "The C surface: load plugins, compile a graph, push, tick and take, from any language that calls C."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
daedalus-abi = { path = "../abi" }
daedalus-backend = { path = "../backend" }
daedalus-graph = { path = "../graph", features = ["alloc"] }
daedalus-host = { path = "../host", features = ["std"] }
daedalus-loader = { path = "../loader" }
daedalus-planner = { path = "../planner" }
daedalus-registry = { path = "../registry" }
daedalus-value = { path = "../value", features = ["std"] }
serde_json = { workspace = true }

[dev-dependencies]
daedalus-abi = { path = "../abi", features = ["count-alloc"] }

# This crate may use unsafe, so it carries its own lint table.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
unused_attributes = "deny"

[lints.clippy]
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
