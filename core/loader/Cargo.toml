[package]
# The integration tests are listed below: see tests/all.rs.
autotests = false
name = "daedalus-loader"
description = "Plugins as dynamic libraries: open and check them, join their nodes, run their steps, retry until they load."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
daedalus-abi = { path = "../abi" }
daedalus-backend = { path = "../backend" }
daedalus-integrity = { path = "../integrity" }
daedalus-made = { path = "../made" }
daedalus-registry = { path = "../registry" }
daedalus-types = { path = "../types" }
libloading = { workspace = true }

# The move of bytes from `cpu.host` reads the runner's cells. A build that stands for a plugin
# made before the newest fields (`daedalus_abi_baseline`) is never a host, and has no move.
[target.'cfg(not(daedalus_abi_baseline))'.dependencies]
daedalus-runner = { path = "../runner" }

[dev-dependencies]
daedalus-abi = { path = "../abi", features = ["count-alloc", "test-run"] }
daedalus-graph = { path = "../graph" }
daedalus-value = { path = "../value" }
daedalus-host = { path = "../host", features = ["std"] }
daedalus-planner = { path = "../planner" }

# This crate may use unsafe, so it carries its own lint table.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
unused_attributes = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(daedalus_abi_baseline)'] }

[lints.clippy]
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"

[[test]]
name = "all"
path = "tests/all.rs"

# Its own process: installs its own global allocator.
[[test]]
name = "bytes"
path = "tests/bytes.rs"

# Its own process: counts this process's file descriptors.
[[test]]
name = "fd_reuse"
path = "tests/fd_reuse.rs"

# Its own process: installs its own global allocator, and reads the process-wide counts of
# released records, which other tests move.
[[test]]
name = "handover"
path = "tests/handover.rs"

# Its own process: installs its own global allocator.
[[test]]
name = "handover_leak"
path = "tests/handover_leak.rs"

# Its own process: counts this process's file descriptors.
[[test]]
name = "integrity"
path = "tests/integrity.rs"

# Its own process: installs its own global allocator.
[[test]]
name = "reload_leak"
path = "tests/reload_leak.rs"
