[package]
# The integration tests are listed below: see tests/all.rs.
autotests = false
name = "daedalus-lang-python"
description = "The Python worker SDK, and the check that runs the canonical fixtures through it."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
daedalus-backend-process = { path = "../../backends/process" }

[dev-dependencies]
# Built beside the tests, as the shared libraries the Python SDK's tests load with ctypes.
daedalus-capi = { path = "../../core/capi" }
daedalus-client-capi = { path = "../client-capi" }
daedalus-drive-conformance = { path = "../../testing/crates/drive-conformance" }
daedalus-integrity = { path = "../../core/integrity" }
daedalus-worker-conformance = { path = "../../testing/crates/worker-conformance" }

[lints]
workspace = true

[[test]]
name = "all"
path = "tests/all.rs"

# Its own process: counts this process's file descriptors.
[[test]]
name = "integrity"
path = "tests/integrity.rs"
