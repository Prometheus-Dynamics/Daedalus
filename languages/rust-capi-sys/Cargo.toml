[package]
name = "daedalus-capi-sys"
description = "The C surface, loaded from its shared library: the typed function table, and each call made safely."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
libloading = { workspace = true }

[dev-dependencies]
daedalus-capi = { path = "../../core/capi" }

# This crate may use unsafe (see AGENTS.md), so it carries its own lint table.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
unused_attributes = "deny"

[lints.clippy]
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
