[workspace]
members = [
    "crates/daedalus",
    "crates/core",
    "crates/transport",
    "crates/data",
    "crates/wgsl-infer",
    "crates/gpu",
    "crates/registry",
    "crates/planner",
    "crates/runtime",
    "crates/macros",
    "crates/nodes",
    "crates/engine",
    "crates/daemon",
    "crates/frame-bench",
    "crates/ffi/core",
    "crates/ffi/host",
    "crates/ffi/python",
    "crates/ffi/node",
    "crates/ffi/java",
    "crates/ffi/cpp",
    "crates/mcu/device",
    "crates/mcu/macros",
    "crates/mcu/build",
    "examples",
    "examples/plugins/math",
    "examples/plugins/example_project",
    "examples/plugins/example_project_dylib",
    "examples/plugins/foreign_consumer",
    "examples/plugins/dependent",
    "examples/plugins/framelease",
    "examples/plugins/stable_abi",
    "examples/wasm_smoke",
    "examples/nostd_smoke",
    "examples/mcu_blink",
    "examples/mcu_blink/nodes",
    "examples/wasm_bindgen_host",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "3.0.0"
authors = ["Mathias Petersen"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Prometheus-Dynamics/Daedalus"
homepage = "https://github.com/Prometheus-Dynamics/Daedalus"
rust-version = "1.99"

[workspace.dependencies]
# Crates shared with the `no_std` tier (see "Portability" in docs/development.md) are declared
# without default features; `std` consumers enable `features = ["std"]` themselves.
daedalus = { package = "daedalus-rs", path = "crates/daedalus", version = "3.0.0", default-features = false }
daedalus-core = { path = "crates/core", version = "3.0.0", default-features = false }
daedalus-transport = { path = "crates/transport", version = "3.0.0", default-features = false }
daedalus-data = { path = "crates/data", version = "3.0.0", default-features = false }
daedalus-wgsl-infer = { path = "crates/wgsl-infer", version = "3.0.0" }
daedalus-gpu = { path = "crates/gpu", version = "3.0.0" }
daedalus-registry = { path = "crates/registry", version = "3.0.0", default-features = false }
daedalus-planner = { path = "crates/planner", version = "3.0.0", default-features = false }
daedalus-runtime = { path = "crates/runtime", version = "3.0.0", default-features = false }
daedalus-macros = { path = "crates/macros", version = "3.0.0" }
daedalus-nodes = { path = "crates/nodes", version = "3.0.0" }
daedalus-engine = { path = "crates/engine", version = "3.0.0", default-features = false }
daedalus-daemon = { path = "crates/daemon", version = "3.0.0" }
daedalus-ffi-core = { path = "crates/ffi/core", version = "3.0.0", default-features = false }
daedalus-ffi-host = { path = "crates/ffi/host", version = "3.0.0", default-features = false }
daedalus-ffi-python = { path = "crates/ffi/python", version = "3.0.0" }
daedalus-ffi-node = { path = "crates/ffi/node", version = "3.0.0" }
daedalus-ffi-java = { path = "crates/ffi/java", version = "3.0.0" }
daedalus-ffi-cpp = { path = "crates/ffi/cpp", version = "3.0.0" }
daedalus-mcu = { path = "crates/mcu/device", version = "3.0.0" }
daedalus-mcu-macros = { path = "crates/mcu/macros", version = "3.0.0" }
daedalus-mcu-build = { path = "crates/mcu/build", version = "3.0.0" }
daedalus-mcu-blink-nodes = { path = "examples/mcu_blink/nodes", version = "3.0.0" }
daedalus-plugins-example-project = { path = "examples/plugins/example_project", version = "3.0.0" }
daedalus-plugins-stable-abi = { path = "examples/plugins/stable_abi", version = "3.0.0" }
ash = { version = "0.38", default-features = false, features = ["std"] }
async-trait = "0.1.92"
base64 = { version = "0.23.1", default-features = false, features = ["alloc"] }
bitflags = { version = "2.13.2", features = ["serde"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
criterion = "0.8.2"
# MCU firmware (`examples/mcu_blink`, built only for `target_os = "none"`).
cortex-m = { version = "0.7.9", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.7"
crossbeam-queue = { version = "0.3.14", default-features = false, features = ["alloc"] }
defmt = "1.1.1"
glob = "0.3.4"
hashbrown = "0.17.1"
half = "2"
libc = "0.2"
libloading = "0.9.0"
once_cell = "1.21.4"
panic-halt = "1.0.0"
paste = "1.0.15"
pollster = "1.0.1"
# Atomics and `Arc` on targets without (64-bit) compare-and-swap; only pulled in there (see
# "Portability" in docs/development.md).
portable-atomic = { version = "1.15.0", default-features = false, features = ["fallback"] }
portable-atomic-util = { version = "0.2.8", default-features = false, features = ["alloc"] }
proc-macro-crate = "3.5.0"
proc-macro2 = "1.0.107"
proptest = "1.11.0"
pyo3 = "0.29"
quote = "1.0.47"
rand = "0.10.3"
rayon = "1.12.0"
serde = { version = "1.0.229", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0.151", default-features = false, features = ["alloc"] }
serde_path_to_error = "0.1.20"
sha2 = "0.11"
spin = { version = "0.12.3", default-features = false, features = ["once", "rwlock", "spin_mutex"] }
parking_lot = "0.12.5"
# `union` is always on: it changes `SmallVec` layouts, and `NodeIo` crosses the dynamic plugin
# boundary, so it must not depend on whether another crate in the build (e.g. wgpu-hal) enables it.
smallvec = { version = "1.16.2", features = ["serde", "union"] }
syn = { version = "3.0.6", features = ["full"] }
tempfile = "3.27.0"
thiserror = { version = "2.0.21", default-features = false }
tokio = { version = "1.53.2", features = ["rt", "macros", "sync"] }
trybuild = "1.0.121"
wgpu = { version = "30.0.1", default-features = false, features = ["std", "wgsl", "vulkan", "metal", "dx12"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
tracing = { version = "0.1.44", default-features = false }
wasm-bindgen = "0.2.129"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "std"] }
styx = { version = "2.0.0", git = "https://github.com/Prometheus-Dynamics/Styx.git", branch = "dev", default-features = false }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
unused_attributes = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.metadata.prometheus-dependency-policy]
error_handling = "Library crates use thiserror for typed errors."
instrumentation = "Structured instrumentation uses tracing."
centralization = "Shared internal crates and common third-party crates belong in workspace.dependencies."
implementation_variants = [
    "Daedalus keeps gpu-mock and gpu-wgpu as stable feature-gated backend variants.",
]
allowed_manifest_exceptions = []

# `crates/daedalus/tests/dylib_plugin.rs` builds these examples as `cdylib`s. Dropping their own
# debug info and stripping the shared objects keeps the debug `.so`s small and quick to link; it
# does not affect the rustc/build-fingerprint checks the loader performs.
[profile.dev.package.daedalus-plugins-example-project]
debug = 0
strip = "debuginfo"

[profile.dev.package.daedalus-plugins-example-project-dylib]
debug = 0
strip = "debuginfo"

[profile.dev.package.daedalus-plugins-foreign-consumer]
debug = 0
strip = "debuginfo"

[profile.dev.package.daedalus-plugins-dependent]
debug = 0
strip = "debuginfo"

[profile.dev.package.daedalus-plugins-stable-abi]
debug = 0
strip = "debuginfo"

# Firmware size profile (`scripts/ci.sh mcu`, docs/mcu.md).
[profile.mcu]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
