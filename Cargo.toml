[workspace]
# Every directory directly inside these folders must be a crate. Adding a crate
# never edits this file.
members = [
  "core/*",
  "backends/*",
  "languages/*",
  "service/*",
  "testing/crates/*",
  "examples/*",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "3.0.1-dev"
authors = ["Mathias Petersen"]
license = "MIT OR Apache-2.0"
rust-version = "1.99"
repository = "https://github.com/Prometheus-Dynamics/Daedalus"
homepage = "https://github.com/Prometheus-Dynamics/Daedalus"

[workspace.dependencies]
ash = { version = "0.38", default-features = false, features = ["std"] }
naga = { version = "30.0.1", default-features = false, features = ["wgsl-in", "spv-out"] }
criterion = "0.8.2"
cortex-m = { version = "0.7.9", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.7"
defmt = "1.1.1"
defmt-rtt = "1.0"
embedded-hal = "1.0.0"
libc = "0.2"
# Shared memory for process workers, at the revision the rest of the stack pins. These three crates
# depend on nothing but libc; scripts/boundaries.py allows exactly them from that repository.
shm-fdpass = { git = "https://github.com/Prometheus-Dynamics/Lemnos", rev = "bded77a096ce48cf00d686ceb8f3a41286ea871e" }
shm-ring-buffers = { git = "https://github.com/Prometheus-Dynamics/Lemnos", rev = "bded77a096ce48cf00d686ceb8f3a41286ea871e" }
shm-ring-holds = { git = "https://github.com/Prometheus-Dynamics/Lemnos", rev = "bded77a096ce48cf00d686ceb8f3a41286ea871e" }
libloading = "0.9.0"
listenfd = "1.0.2"
panic-halt = "1.0.0"
pollster = "1.0.1"
rp2040-boot2 = "0.3.0"
rp2040-hal = "0.12.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
serde = { version = "1.0.229", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0.151", default-features = false, features = ["alloc"] }
serde_path_to_error = "0.1.20"
signal-hook = { version = "0.3.18", default-features = false }
sha2 = "0.11"
spin = { version = "0.12.3", default-features = false, features = ["once", "rwlock", "spin_mutex"] }
syn = { version = "3.0.6", features = ["full"] }
toml = { version = "1.2", default-features = false, features = ["parse", "serde", "std"] }
trybuild = "1.0.121"
wgpu = { version = "30.0.1", default-features = false, features = ["std", "wgsl", "vulkan"] }
wasm-bindgen = "0.2.129"

# Crates that may use `unsafe` carry their own lint table.
[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
unused_attributes = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"

# Line tables keep file:line in panics; dependencies carry no debug info.
# The workspace's own code is built at opt-level 1, with its debug assertions and overflow checks
# kept: the long tests are compute in this code (a tick moving a 1 MiB value, hundreds of device
# openings), which runs several times faster for a little more build time. Dependencies stay at
# 0: optimising them costs far more build than it gives back.
[profile.dev]
debug = "line-tables-only"
opt-level = 1

[profile.dev.package."*"]
debug = false
opt-level = 0

# The plugin digest. Tests hash every library they load, and sha2 unoptimised is the slowest part.
[profile.dev.package.sha2]
opt-level = 3

# What is built to run: one unit, optimised across crates. It is about a fifth smaller than the
# compiler's default for the daemon and a host, and no slower. It costs build time, which a
# debug build doesn't pay.
[profile.release]
lto = "fat"
codegen-units = 1

# Firmware size profile.
[profile.chip]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
