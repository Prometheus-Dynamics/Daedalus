[workspace]
# Every directory directly inside these folders must be a crate. Adding a crate
# never edits this file.
members = [
  "core/*",
  "backends/*",
  "languages/*",
  "service/*",
  "testing/crates/*",
  "examples/*",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "3.0.1-dev"
authors = ["Mathias Petersen"]
license = "MIT OR Apache-2.0"
rust-version = "1.99"
repository = "https://github.com/Prometheus-Dynamics/Daedalus"
homepage = "https://github.com/Prometheus-Dynamics/Daedalus"

[workspace.dependencies]
ash = { version = "0.38", default-features = false, features = ["std"] }
naga = { version = "30.0.1", default-features = false, features = ["wgsl-in", "spv-out"] }
async-trait = "0.1.92"
bitflags = { version = "2.13.2", features = ["serde"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
criterion = "0.8.2"
cortex-m = { version = "0.7.9", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.7"
crossbeam-queue = { version = "0.3.14", default-features = false, features = ["alloc"] }
defmt = "1.1.1"
defmt-rtt = "1.0"
embedded-hal = "1.0.0"
glob = "0.3.4"
hashbrown = "0.17.1"
libc = "0.2"
windows-sys = { version = "0.61", default-features = false }
libloading = "0.9.0"
listenfd = "1.0.2"
once_cell = "1.21.4"
panic-halt = "1.0.0"
paste = "1.0.15"
pollster = "1.0.1"
rp2040-boot2 = "0.3.0"
rp2040-hal = "0.12.0"
portable-atomic = { version = "1.15.0", default-features = false, features = ["fallback"] }
portable-atomic-util = { version = "0.2.8", default-features = false, features = ["alloc"] }
proc-macro-crate = "3.5.0"
proc-macro2 = "1.0.107"
proptest = "1.11.0"
pyo3 = "0.29"
quote = "1.0.47"
rand = "0.10.3"
serde = { version = "1.0.229", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0.151", default-features = false, features = ["alloc"] }
serde_path_to_error = "0.1.20"
signal-hook = { version = "0.3.18", default-features = false }
sha2 = "0.11"
spin = { version = "0.12.3", default-features = false, features = ["once", "rwlock", "spin_mutex"] }
arrayvec = "0.7.8"
parking_lot = "0.12.5"
smallvec = { version = "1.16.2", features = ["serde", "union"] }
syn = { version = "3.0.6", features = ["full"] }
tempfile = "3.27.0"
thiserror = { version = "2.0.21", default-features = false }
toml = { version = "1.2", default-features = false, features = ["parse", "serde", "std"] }
tokio = { version = "1.53.2", features = ["rt", "macros", "sync"] }
trybuild = "1.0.121"
wgpu = { version = "30.0.1", default-features = false, features = ["std", "wgsl", "vulkan"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
tracing = { version = "0.1.44", default-features = false }
wasm-bindgen = "0.2.129"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "std"] }

# Crates that may use `unsafe` carry their own lint table.
[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
unused_attributes = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"

# Line tables keep file:line in panics; dependencies carry no debug info.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# The kernels are vectorized by the optimizer: debug builds must run the vector code,
# so the conformance tests check it.
[profile.dev.package.daedalus-kernels-sys]
opt-level = 3
overflow-checks = false
debug-assertions = false

# Firmware size profile.
[profile.chip]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
