[package]
name = "daedalus-wasm-smoke"
version.workspace = true
edition.workspace = true
publish = false
description = "wasm32 runtime smoke modules for the embedded preset (scripts/ci.sh wasm)."

[lints]
workspace = true

# A `cdylib` with no imports that `scripts/wasm-smoke.mjs` instantiates (`wasm32-unknown-unknown`),
# and a WASI command that `scripts/wasi-smoke.mjs` runs (`wasm32-wasip1`). Its own package rather
# than a facade example, so the wasm build does not pull the facade's native-only dev-dependencies.
[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]
doctest = false

[[bin]]
name = "daedalus-wasi-smoke"
path = "src/main.rs"

[dependencies]
# `engine` + `plugins`: the `embedded` preset without `threads`, which this target lacks.
daedalus = { workspace = true, features = ["engine", "plugins"] }
