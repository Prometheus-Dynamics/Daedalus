[package]
name = "daedalus-plugins-stable-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]
doctest = false

[features]
# Export the plugin from the `cdylib` with a descriptor that claims another rustc, so hosts
# refuse its Rust ABI and install it through the stable handler path (as `stable_abi` does).
dylib = ["daedalus/dylib-plugins"]

[dependencies]
daedalus = { workspace = true, features = ["plugins"] }
