[package]
name = "daedalus-plugins-example-project"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[lib]
path = "src/lib.rs"
doctest = false

[features]
# `declare_plugin!` gates its installer on the calling crate's `plugins` feature.
default = ["plugins"]
plugins = []
# No-op: only gives this crate another build identity. `foreign_consumer` and
# `example_project_dylib` enable it so their copy of `Counter` is deliberately a different Rust
# type from the host's (a separately built dependency).
separate-build = []

[dependencies]
daedalus = { workspace = true, features = ["plugins"] }
