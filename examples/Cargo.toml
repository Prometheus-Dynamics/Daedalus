[package]
name = "daedalus-examples"
version = "3.0.1-dev"
edition.workspace = true
rust-version.workspace = true
description = "Runnable examples for the Daedalus dataflow runtime workspace."
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[features]
default = ["plugins"]
plugins = []
gpu-wgpu = ["daedalus/gpu-wgpu"]

[dependencies]
parking_lot = { workspace = true }
daedalus = { workspace = true, features = ["engine-full", "plugins"] }
tokio = { workspace = true, features = ["rt", "macros", "sync", "time"] }
tracing-subscriber = { workspace = true }

