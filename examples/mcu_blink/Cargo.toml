[package]
name = "daedalus-mcu-blink"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "MCU profile example: a five-node graph planned on the host and run allocation-free on Cortex-M (scripts/ci.sh mcu)."

[lints]
workspace = true

# `#![no_std]` library holding the generated graph; `tests/native.rs` runs it on the host.
[lib]
path = "src/lib.rs"
doctest = false

# Firmware for `thumbv7em-none-eabihf` / `thumbv6m-none-eabi`; an empty `main` elsewhere.
[[bin]]
name = "daedalus-mcu-blink"
path = "src/main.rs"
test = false
bench = false

# The same firmware in compiled + tunable mode.
[[bin]]
name = "daedalus-mcu-blink-tunable"
path = "src/bin/tunable.rs"
test = false
bench = false

# The same firmware in loaded mode (interpreter, plans A and B).
[[bin]]
name = "daedalus-mcu-blink-loaded"
path = "src/bin/loaded.rs"
test = false
bench = false

[dependencies]
daedalus-mcu = { workspace = true, features = ["loaded"] }
daedalus-mcu-blink-nodes = { workspace = true }

# The generator (`examples/generate.rs`) plans the graphs into `generated/`, and the native tests
# compile blobs and parameter updates as a host tool would. Nothing here runs at build time.
[dev-dependencies]
daedalus-mcu-build = { workspace = true }

[target.'cfg(target_os = "none")'.dependencies]
cortex-m = { workspace = true }
cortex-m-rt = { workspace = true }
panic-halt = { workspace = true }
