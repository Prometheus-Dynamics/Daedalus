[package]
name = "daedalus-mcu-board"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "The MCU blink graph on a board: ADC in, GPIO out, through a HAL (Raspberry Pi Pico), measuring tick time and stack in each mode. Written, untested on a board."

[lints]
workspace = true

# `#![no_std]`: the `Board` trait and the measurement loop, tested on the host with a mock board.
[lib]
path = "src/lib.rs"
doctest = false

# Raspberry Pi Pico firmware (`thumbv6m-none-eabi`); an empty `main` elsewhere.
[[bin]]
name = "daedalus-mcu-pico"
path = "src/main.rs"
test = false
bench = false

[dependencies]
daedalus-mcu = { workspace = true, features = ["loaded"] }
daedalus-mcu-blink = { workspace = true }

[target.'cfg(target_os = "none")'.dependencies]
cortex-m = { workspace = true }
cortex-m-rt = { workspace = true }

[target.thumbv6m-none-eabi.dependencies]
defmt = { workspace = true }
defmt-rtt = { workspace = true }
embedded-hal = { workspace = true }
panic-halt = { workspace = true }
rp2040-boot2 = { workspace = true }
rp2040-hal = { workspace = true, features = ["rt"] }
