[package]
name = "daedalus-plugins-rust-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Example Rust plugin served as an out-of-process persistent worker."
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["plugins"]
# Named by the `declare_plugin!` expansion (see `daedalus-ffi-rust`).
plugins = []

[dependencies]
daedalus = { workspace = true, features = ["plugins"] }
daedalus-ffi-core = { workspace = true }
daedalus-ffi-rust = { workspace = true }

[dev-dependencies]
daedalus-ffi-host = { workspace = true }
serde_json = { workspace = true, features = ["std"] }

[[bin]]
name = "rust_worker"
path = "src/main.rs"
