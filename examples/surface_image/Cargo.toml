[package]
name = "daedalus-surface-image"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

# An image surface: the whole surface C ABI (from `daedalus-surface`'s `rlib`) with the
# `stable_abi` nodes installed in-image, through the Rust path. Only a `cdylib`: the
# `alloc-count` feature's global allocator must not reach a binary that links it.
[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]
doctest = false
test = false

[features]
# The surface's counting allocator and `daedalus_surface_allocations` (the wrapper's test).
alloc-count = ["daedalus-surface/alloc-count"]

[dependencies]
daedalus = { workspace = true, features = ["plugins"] }
daedalus-plugins-stable-abi = { workspace = true }
daedalus-surface = { workspace = true }
