[package]
name = "daedalus-chip-shared"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "One set of nodes, run on a full host and on a chip with no heap."

[lints]
workspace = true

[lib]
path = "src/lib.rs"
doctest = false

[features]
# The tests that run the graph under a full host.
host = ["dep:daedalus", "daedalus-cpu/std"]

[dependencies]
daedalus = { path = "../../core/daedalus", features = ["std"], optional = true }
daedalus-cpu = { path = "../../backends/cpu", default-features = false, features = ["blob"] }
daedalus-cpu-author = { path = "../../backends/cpu-author", default-features = false }
daedalus-macros = { path = "../../core/macros" }
daedalus-registry = { path = "../../core/registry", default-features = false }

# The generator and the native tests. Nothing here is part of the firmware.
[dev-dependencies]
daedalus-cpu = { path = "../../backends/cpu", features = ["source"] }
daedalus-graph = { path = "../../core/graph" }
daedalus-planner = { path = "../../core/planner" }
daedalus-registry = { path = "../../core/registry" }
