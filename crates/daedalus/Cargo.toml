[package]
name = "daedalus-rs"
version = "3.0.0"
edition = "2024"
rust-version.workspace = true
description = "Facade crate for the Daedalus dataflow runtime (CPU/GPU node graphs)."
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/daedalus-rs"
readme = "README.md"
keywords = ["dataflow", "graph", "gpu", "wgpu", "pipeline"]
categories = ["concurrency", "graphics"]

[lints]
workspace = true

[lib]
path = "src/lib.rs"
name = "daedalus"
doctest = false

[package.metadata.daedalus]
# Classifies every feature for the dynamic plugin build fingerprint (`daedalus::dylib`):
# boundary features change types that cross the plugin boundary and must match between host
# and plugin; host-only features only change host-side execution.
boundary-features = [
    "gpu-types",
    "gpu-runtime",
    "gpu-wgpu",
    "gpu-gles",
    "gpu-async",
    "gpu-mock",
    "schema",
    "proto",
    "plugins",
]
host-only-features = [
    "gpu-engine",
    "gpu",
    "gpu-dmabuf",
    "gpu-image",
    "dylib-plugins",
    "examples",
    "styx-camera-example",
    "engine",
    "executor-pool",
    "metrics",
    "alloc-probe",
    "engine-full",
    "embedded",
    "threads",
    "tracing",
]

[features]
default = ["threads", "tracing"]
# Worker threads: `RuntimeMode::Parallel`/`Adaptive` on a worker pool, stream workers and
# blocking host waits (`HostGraph::drive_blocking`, ...). Without it (e.g. on
# `wasm32-unknown-unknown`) those modes run serially and the thread-only APIs do not exist.
threads = ["daedalus-runtime/threads", "daedalus-engine?/threads"]
gpu-types = ["dep:daedalus-gpu"]
gpu-runtime = [
    "gpu-types",
    "daedalus-registry/gpu",
    "daedalus-planner/gpu",
    "daedalus-runtime/gpu",
    # Keep the engine's planner config in sync with `daedalus-planner/gpu` when both are on.
    "daedalus-engine?/gpu",
]
gpu-engine = [
    "gpu-runtime",
    "engine",
    "daedalus-engine/gpu",
]
gpu = ["gpu-engine"]
# wgpu backend: Vulkan, plus Metal on Apple and DX12 on Windows.
gpu-wgpu = ["gpu-engine", "daedalus-gpu/gpu-wgpu"]
# wgpu's OpenGL/GLES backend for devices without Vulkan (changes wgpu internals, so a boundary
# feature).
gpu-gles = ["gpu-wgpu", "daedalus-gpu/gpu-gles"]
# `image` crate bridges in `daedalus::gpu` (`Compute<DynamicImage>`, `ShaderRunOutput` image
# readbacks).
gpu-image = ["gpu-wgpu", "daedalus-gpu/gpu-image"]
gpu-async = ["gpu-wgpu", "daedalus-gpu/gpu-async"]
gpu-dmabuf = ["gpu-wgpu", "daedalus-gpu/gpu-dmabuf"]
gpu-mock = ["gpu-runtime", "daedalus-gpu/gpu-mock"]
schema = ["daedalus-data/schema", "daedalus-planner/schema"]
proto = ["daedalus-data/proto", "daedalus-planner/proto"]
plugins = ["daedalus-registry/plugin", "daedalus-runtime/plugins", "daedalus-nodes/plugins"]
# Native Rust plugin `cdylib`s: export them with `export_plugin!` and load them at runtime
# with `PluginLibrary`. Both plugin crates and hosts enable it.
dylib-plugins = [
    "plugins",
    # Plugin and host must agree on the runtime lock backend (a boundary feature).
    "daedalus-runtime/std",
    "dep:daedalus-ffi-host",
    "dep:libloading",
    "dep:serde_json",
    "dep:thiserror",
]
examples = []
styx-camera-example = ["engine", "plugins", "dep:styx"]
# Lean engine: planner + serial/scoped-thread executor, no Rayon worker pool, no metrics.
engine = [
    "dep:daedalus-engine",
    "daedalus-engine/config-env",
    "daedalus-engine/plugins",
]
# Persistent Rayon worker pool for `RuntimeMode::Parallel`/`Adaptive` (pulls rayon + crossbeam).
# Without it those modes run ready segments on scoped threads.
executor-pool = ["threads", "daedalus-runtime/executor-pool", "daedalus-engine?/executor-pool"]
# Collect executor telemetry (`MetricsLevel` other than `Off`). Without it the telemetry APIs
# still compile but record nothing.
metrics = ["daedalus-runtime/metrics", "daedalus-engine?/metrics"]
# `daedalus::alloc_probe`: a counting global allocator attributing allocations to node handlers,
# the runtime and host-bridge calls; `HostGraph::frame_overhead` reports them per tick.
alloc-probe = ["daedalus-runtime/alloc-probe", "daedalus-engine?/alloc-probe"]
# `tracing` spans and events of the runtime, engine, planner and demo nodes (default). Separate
# from `threads`/`std`: `default-features = false` builds (`embedded`, wasm) opt in explicitly.
tracing = [
    "daedalus-runtime/tracing",
    "daedalus-engine?/tracing",
    "daedalus-planner/tracing",
    "daedalus-nodes/tracing",
]
# Recommended preset for applications: engine with worker pool and metrics.
engine-full = ["engine", "executor-pool", "metrics"]
# Smallest in-process host: engine + static plugins, no worker pool, no metrics, no `tracing`
# (add the `tracing` feature to keep spans). Keeps `threads`; for targets without threads use
# `engine,plugins` with default features off.
embedded = ["engine", "plugins", "threads"]

[dependencies]
daedalus-core = { workspace = true, features = ["std"] }
daedalus-transport = { workspace = true, features = ["std"] }
daedalus-data = { workspace = true, features = ["std", "json"] }
daedalus-gpu = { workspace = true, optional = true }
daedalus-registry = { workspace = true, features = ["std"] }
daedalus-planner = { workspace = true, features = ["std"] }
daedalus-runtime = { workspace = true }
daedalus-macros = { workspace = true }
daedalus-nodes = { workspace = true }
daedalus-engine = { workspace = true, optional = true }
styx = { workspace = true, features = ["v4l2", "libcamera", "preview-window"], optional = true }
daedalus-ffi-host = { workspace = true, optional = true }
libloading = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true, features = ["std"] }
thiserror = { workspace = true, optional = true, features = ["std"] }

[dev-dependencies]
parking_lot = { workspace = true }
daedalus-plugins-example-project = { workspace = true }
daedalus-plugins-stable-abi = { workspace = true }
image = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
trybuild = { workspace = true }
criterion = { workspace = true }

# Integration tests share one binary (`tests/it`) where they can, so the crate graph is linked
# and its generic code instantiated once. Separate binaries: tests with their own counting
# `#[global_allocator]` (one per binary), the `dylib-plugins` tests (`export_plugin!` exports
# fixed symbols, once per binary) and trybuild.
[[test]]
name = "it"
path = "tests/it/main.rs"
required-features = ["engine", "plugins"]

[[test]]
name = "macro_hot_path_allocations"
path = "tests/macro_hot_path_allocations.rs"
required-features = ["engine", "plugins"]

[[test]]
name = "held_host_inputs"
path = "tests/held_host_inputs.rs"
required-features = ["engine", "plugins", "threads"]

[[test]]
name = "multi_camera"
path = "tests/multi_camera.rs"
required-features = ["engine", "plugins", "threads"]

[[test]]
name = "graph_frame_allocations"
path = "tests/graph_frame_allocations.rs"
required-features = ["engine", "plugins"]

[[test]]
name = "transport_macro_ui"
path = "tests/transport_macro_ui.rs"
required-features = ["plugins"]

[[test]]
name = "dylib_plugin"
path = "tests/dylib_plugin.rs"
required-features = ["engine", "dylib-plugins"]

[[test]]
name = "dylib_stable"
path = "tests/dylib_stable.rs"
required-features = ["engine", "dylib-plugins"]

[[test]]
name = "dylib_linked_deps"
path = "tests/dylib_linked_deps.rs"
required-features = ["engine", "dylib-plugins"]

[[test]]
name = "dylib_external_types"
path = "tests/dylib_external_types.rs"
required-features = ["dylib-plugins"]

[[test]]
name = "dylib_export_macro"
path = "tests/dylib_export_macro.rs"
required-features = ["dylib-plugins"]

[[bench]]
name = "graph_frame"
harness = false
required-features = ["engine", "plugins"]
