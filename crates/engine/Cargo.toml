[package]
name = "daedalus-engine"
version = "2.0.0"
edition = "2024"
description = "High-level engine facade for planning and running Daedalus graphs."
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/daedalus-engine"
readme = "README.md"
keywords = ["dataflow", "engine", "runtime"]
categories = ["concurrency"]

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
default = ["config-env", "executor-pool", "metrics"]
config-env = ["serde", "serde_json"]
gpu = ["daedalus-runtime/gpu", "daedalus-planner/gpu", "daedalus-gpu"]
gpu-mock = ["gpu", "daedalus-runtime/gpu-mock", "daedalus-gpu/gpu-mock"]
lockfree-queues = ["daedalus-runtime/lockfree-queues"]
executor-pool = ["daedalus-runtime/executor-pool"]
metrics = ["daedalus-runtime/metrics"]
snapshots = ["daedalus-runtime/snapshots"]
plugins = ["daedalus-runtime/plugins"]

[dependencies]
parking_lot = { workspace = true }
daedalus-runtime = { version = "2.0.0", path = "../runtime", default-features = false }
daedalus-core = { workspace = true, features = ["std"] }
daedalus-data = { workspace = true, features = ["std", "json"] }
daedalus-planner = { workspace = true, features = ["std"] }
daedalus-registry = { workspace = true, features = ["std"] }
daedalus-transport = { workspace = true, features = ["std"] }
daedalus-gpu = { workspace = true, optional = true }
serde = { workspace = true, optional = true, features = ["std"] }
serde_json = { workspace = true, optional = true, features = ["std"] }
thiserror = { workspace = true, features = ["std"] }
tracing = { workspace = true, features = ["std"] }

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "host_graph_drive"
harness = false
required-features = ["plugins"]
