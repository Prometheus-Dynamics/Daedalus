[package]
name = "daedalus-engine"
version = "2.0.0"
edition = "2024"
description = "High-level engine facade for planning and running Daedalus graphs."
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/daedalus-engine"
readme = "README.md"
keywords = ["dataflow", "engine", "runtime"]
categories = ["concurrency"]

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
default = ["config-env", "executor-pool", "metrics", "threads", "tracing"]
# Host OS facilities: the runtime's `std` (lock backend, hash maps), `EngineConfig::from_env`.
# Without it the crate is `no_std` + `alloc` (see "Portability" in docs/development.md).
std = [
    "daedalus-runtime/std",
    "daedalus-core/std",
    "daedalus-data/std",
    "daedalus-planner/std",
    "daedalus-registry/std",
    "daedalus-transport/std",
    "serde?/std",
    "serde_json?/std",
    "thiserror/std",
    "tracing?/std",
]
# `tracing` spans and events (default; see `daedalus-runtime`'s `tracing` feature).
tracing = ["dep:tracing", "daedalus-runtime/tracing"]
# Worker threads for `RuntimeMode::Parallel`/`Adaptive`, stream workers and blocking waits
# (`HostGraph::drive_blocking`, ...). Without it those modes run serially.
threads = ["std", "daedalus-runtime/threads"]
# Serde for the config sections and `diagnostics`; `EngineConfig::from_env` also needs `std`.
config-env = ["serde", "serde_json"]
gpu = ["std", "daedalus-runtime/gpu", "daedalus-planner/gpu", "daedalus-gpu"]
gpu-mock = ["gpu", "daedalus-runtime/gpu-mock", "daedalus-gpu/gpu-mock"]
lockfree-queues = ["daedalus-runtime/lockfree-queues"]
executor-pool = ["threads", "daedalus-runtime/executor-pool"]
metrics = ["daedalus-runtime/metrics"]
snapshots = ["daedalus-runtime/snapshots"]
plugins = ["daedalus-runtime/plugins"]

[dependencies]
daedalus-runtime = { workspace = true }
daedalus-core = { workspace = true }
daedalus-data = { workspace = true, features = ["json"] }
daedalus-planner = { workspace = true }
daedalus-registry = { workspace = true }
daedalus-transport = { workspace = true }
daedalus-gpu = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true }
spin = { workspace = true }
tracing = { workspace = true, optional = true }

# Targets without 64-bit atomics (`thumbv7em`, ...): `portable-atomic`'s `AtomicU64` (`portable`).
[target.'cfg(not(target_has_atomic = "64"))'.dependencies]
portable-atomic = { workspace = true }

# Targets without pointer-sized compare-and-swap (`thumbv6m`, `riscv32imc`): atomics, `spin` locks
# and `Arc` go through `portable-atomic`, as in the tier-1 crates (see `daedalus_runtime::sync`).
[target.'cfg(not(target_has_atomic = "ptr"))'.dependencies]
portable-atomic = { workspace = true, features = ["critical-section"] }
portable-atomic-util = { workspace = true }
spin = { workspace = true, features = ["portable_atomic"] }

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "host_graph_drive"
harness = false
required-features = ["plugins"]
