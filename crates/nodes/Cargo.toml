[package]
name = "daedalus-nodes"
version = "3.0.0"
edition = "2024"
rust-version.workspace = true
description = "Demo node implementations and fixtures for Daedalus."
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/daedalus-nodes"
readme = "README.md"
keywords = ["dataflow", "nodes", "fixtures"]
categories = ["development-tools::testing"]

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
default = []
examples = ["bundle-starter"]
bundle-starter = []
registry-adapter = []
planner-adapter = []
bundle-utils = []
plugins = ["daedalus-runtime/plugins"]
# `tracing` output of the demo bundle's sink node.
tracing = ["dep:tracing"]

[dependencies]
daedalus-macros = { workspace = true }
daedalus-registry = { workspace = true, features = ["std"] }
daedalus-planner = { workspace = true, features = ["std"] }
daedalus-runtime = { workspace = true }
daedalus-data = { workspace = true, features = ["std", "json"] }
daedalus-core = { workspace = true, features = ["std"] }
paste = { workspace = true }
serde = { workspace = true, features = ["derive", "std"] }
tracing = { workspace = true, features = ["std"], optional = true }

