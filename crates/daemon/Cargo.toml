[package]
name = "daedalus-daemon"
version = "3.0.0"
edition = "2024"
rust-version.workspace = true
description = "Optional long-lived daemon and CLI for warm Daedalus engine workflows."
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/daedalus-daemon"
readme = "README.md"
keywords = ["dataflow", "daemon", "engine"]
categories = ["concurrency"]

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
default = []
tcp = []

[dependencies]
daedalus-engine = { workspace = true, features = ["config-env", "executor-pool", "metrics"] }
daedalus-planner = { workspace = true, features = ["std"] }
daedalus-registry = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }

[dev-dependencies]
daedalus-data = { workspace = true }
