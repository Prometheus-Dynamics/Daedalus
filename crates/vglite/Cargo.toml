[package]
name = "daedalus-vglite"
version = "3.0.1-dev"
edition = "2024"
rust-version.workspace = true
description = "The K230's VGLite 2.5D GPU (resize, crop, flip, rotate, fill, blend, palette, lines) through the vendor's libvg_lite, loaded at run time."
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/daedalus-vglite"
readme = "README.md"
keywords = ["k230", "vglite", "dmabuf", "2d", "gpu"]
categories = ["hardware-support", "multimedia::images"]

[lints]
workspace = true

[package.metadata.daedalus]
boundary-features = []
host-only-features = []

[dependencies]
daedalus-rga = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
lemnos-linux = { workspace = true, features = ["dma"] }
libc = { workspace = true }

[dev-dependencies]
daedalus-accel = { workspace = true, features = ["std"] }
daedalus-kernels = { workspace = true, features = ["std"] }
