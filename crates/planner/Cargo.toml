[package]
name = "daedalus-planner"
version = "2.0.0"
edition = "2024"
description = "Planner that validates and schedules Daedalus dataflow graphs."
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/daedalus-planner"
readme = "README.md"
keywords = ["dataflow", "graph", "planner"]
categories = ["algorithms"]

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[package.metadata.daedalus]
# Classifies every feature for the dynamic plugin build fingerprint (`daedalus::dylib`):
# boundary features change types that cross the plugin boundary and must match between host
# and plugin; host-only features only change host-side execution.
boundary-features = ["std", "gpu", "proto", "schema"]
host-only-features = []

[[bin]]
name = "graph_document_schema"
path = "src/bin/graph_document_schema.rs"
required-features = ["std", "schema"]

[[bin]]
name = "plan_dump"
path = "src/bin/plan_dump.rs"
required-features = ["std"]

[features]
default = ["std"]
# Host OS facilities: `std` locks and collections, clocks, threads. Without it the crate is
# `no_std` + `alloc` (see "Portability" in docs/development.md).
std = [
    "dep:parking_lot",
    "daedalus-core/std",
    "daedalus-data/std",
    "daedalus-registry/std",
    "daedalus-transport/std",
    "serde/std",
    "serde_json/std",
    "thiserror/std",
    "dep:tracing",
    "tracing/std",
]
gpu = ["std", "daedalus-gpu"]
proto = []
schema = ["daedalus-data/schema"]

[dependencies]
parking_lot = { workspace = true, optional = true }
daedalus-data = { workspace = true, features = ["json"] }
daedalus-registry = { workspace = true }
daedalus-transport = { workspace = true }
daedalus-gpu = { workspace = true, optional = true }
daedalus-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_path_to_error = { workspace = true }
spin = { workspace = true }
thiserror = { workspace = true }
# Only `std` builds trace (`DAEDALUS_TRACE_EMBEDDED_EXPAND`); `tracing` needs compare-and-swap.
tracing = { workspace = true, optional = true }

# Targets without 64-bit atomics (`thumbv7em`, ...): `portable-atomic`'s `AtomicU64`.
[target.'cfg(not(target_has_atomic = "64"))'.dependencies]
portable-atomic = { workspace = true }

# Targets without pointer-sized compare-and-swap (`thumbv6m`, `riscv32imc`): atomics, `spin` locks
# and `Arc` go through `portable-atomic`, whose `critical-section` implementation the final
# binary provides (see "Portability" in docs/development.md).
[target.'cfg(not(target_has_atomic = "ptr"))'.dependencies]
portable-atomic = { workspace = true, features = ["critical-section"] }
portable-atomic-util = { workspace = true }
spin = { workspace = true, features = ["portable_atomic"] }

[dev-dependencies]
once_cell = { workspace = true }
