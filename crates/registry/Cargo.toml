[package]
name = "daedalus-registry"
version = "2.0.0"
edition = "2024"
description = "Node registry and plugin bundle loader for Daedalus graphs."
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/daedalus-registry"
readme = "README.md"
keywords = ["dataflow", "registry", "plugins"]
categories = ["data-structures"]

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[package.metadata.daedalus]
# Classifies every feature for the dynamic plugin build fingerprint (`daedalus::dylib`):
# boundary features change types that cross the plugin boundary and must match between host
# and plugin; host-only features only change host-side execution.
boundary-features = ["std", "bundle", "plugin", "gpu"]
host-only-features = []

[features]
default = ["std"]
# Host OS facilities: `std` locks and collections, clocks, threads. Without it the crate is
# `no_std` + `alloc` (see "Portability" in docs/development.md).
std = [
    "daedalus-core/std",
    "daedalus-data/std",
    "daedalus-transport/std",
    "serde/std",
    "serde_json/std",
    "thiserror/std",
]
bundle = []
plugin = []
gpu = ["std", "daedalus-gpu"]

[dependencies]
daedalus-data = { workspace = true }
daedalus-gpu = { workspace = true, optional = true }
daedalus-core = { workspace = true }
daedalus-transport = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
once_cell = { workspace = true }
