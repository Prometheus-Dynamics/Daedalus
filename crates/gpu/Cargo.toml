[package]
name = "daedalus-gpu"
version = "3.0.1-dev"
edition = "2024"
rust-version.workspace = true
description = "GPU backends and WGSL dispatch helpers for the Daedalus runtime."
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/daedalus-gpu"
readme = "README.md"
keywords = ["gpu", "wgsl", "wgpu", "compute"]
categories = ["graphics"]

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
default = ["gpu-noop"]
gpu-noop = []
gpu-mock = []
# wgpu backend: Vulkan everywhere, plus Metal on Apple and DX12 on Windows.
gpu-wgpu = ["wgpu", "pollster", "bytemuck", "daedalus-wgsl-infer", "dep:ash"]
# wgpu's OpenGL/GLES backend (glow, EGL, Wayland loaders) for devices without Vulkan.
gpu-gles = ["gpu-wgpu", "wgpu/gles"]
# `image` crate bridges: `Compute<DynamicImage>`, `DeviceBridge` for `image` buffers and the
# `ShaderRunOutput` image readback helpers (pulls `image`/`png`/`flate2`).
gpu-image = ["gpu-wgpu", "dep:image"]
gpu-async = ["async-trait"]
# Zero-copy import of Linux dmabuf frames into wgpu textures (Vulkan only).
gpu-dmabuf = ["gpu-wgpu"]
# Raw Vulkan handles of a context and its storage, for SPIR-V kernels from outside Daedalus run
# on its device (Linux; `daedalus_gpu::raw_vulkan`).
gpu-vulkan-raw = ["gpu-wgpu", "gpu-dmabuf"]
# NVIDIA CUDA backend: the driver API, loaded at runtime from libcuda (no CUDA toolkit at build
# time, no link-time dependency). Kernels are PTX text the driver JIT-compiles.
gpu-cuda = ["dep:libloading"]

[dependencies]
arrayvec = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true, features = ["std"] }
async-trait = { workspace = true, optional = true }
bitflags = { workspace = true }
wgpu = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
bytemuck = { workspace = true, optional = true }
image = { workspace = true, optional = true }
daedalus-wgsl-infer = { workspace = true, optional = true }
tracing = { workspace = true, features = ["std"] }
# Vectorized conversions and row copies (`docs/backend-matrix.md`).
daedalus-kernels = { workspace = true, features = ["std"] }
# Opening libcuda at runtime for `gpu-cuda`.
libloading = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
lemnos-linux = { workspace = true, features = ["dma"] }
ash = { workspace = true, optional = true }
# poll/ioctl for dmabuf acquire fences.
libc = { workspace = true }
# `daedalus:frame` views as import descriptors (`ExternalFrameDescriptor::from_frame_view`).
daedalus-transport = { workspace = true }

[dev-dependencies]
bytemuck = { workspace = true }
# SPIR-V for the raw Vulkan dispatch test (the version wgpu already builds).
naga = { workspace = true }
daedalus-accel = { workspace = true, features = ["std"] }
# Loading the plugin `cdylib` of the `plugin_submit` test, and reading cargo's build report.
libloading = { workspace = true }
serde_json = { workspace = true }

[[example]]
name = "gpu_probe"
required-features = ["gpu-dmabuf"]

[[example]]
name = "gpu_bench"
required-features = ["gpu-dmabuf"]

[[example]]
name = "sync_hazard_control"
required-features = ["gpu-vulkan-raw"]

[[bench]]
name = "dispatch_readback"
harness = false
required-features = ["gpu-wgpu", "gpu-async"]

[[test]]
name = "gpu_allocations"
required-features = ["gpu-wgpu"]

[[test]]
name = "shared_device"
required-features = ["gpu-wgpu", "gpu-mock"]

[[test]]
name = "driver_stress"
required-features = ["gpu-wgpu"]

[[test]]
name = "raw_submitter_allocations"
required-features = ["gpu-vulkan-raw"]

[[test]]
name = "plugin_submit"
required-features = ["gpu-vulkan-raw"]

[[test]]
name = "cuda_device"
required-features = ["gpu-cuda"]

[[test]]
name = "cuda_interop"
required-features = ["gpu-cuda", "gpu-vulkan-raw"]
