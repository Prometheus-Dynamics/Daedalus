[package]
name = "daedalus-kernels"
version = "3.0.1-dev"
edition = "2024"
rust-version.workspace = true
description = "Daedalus's data-parallel CPU kernels (pixel and float conversions, row copies, base64, hex), vectorized per ISA and registered in the acceleration inventory."
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/daedalus-kernels"
readme = "README.md"
keywords = ["simd", "kernels", "conversion", "base64"]
categories = ["no-std", "encoding"]

[lints]
workspace = true

[package.metadata.daedalus]
boundary-features = []
host-only-features = ["std"]

[features]
default = ["std"]
# Runtime selection of AVX2 kernels on x86 (`is_x86_feature_detected`). Without it, x86 runs
# the SSE2 (or compiled-in) kernels.
std = []

[dependencies]
daedalus-accel = { workspace = true }

[dev-dependencies]
daedalus-accel = { workspace = true, features = ["std"] }

# The RGA and VGLite fixed-function rows in `registry/fixed.rs` are checked against Lemnos's
# route table. Linux only, where the Lemnos routes are.
[target.'cfg(target_os = "linux")'.dev-dependencies]
lemnos-drivers-rga = { workspace = true }
