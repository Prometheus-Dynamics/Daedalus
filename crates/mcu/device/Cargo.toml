[package]
name = "daedalus-mcu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Allocation-free microcontroller executor for Daedalus graphs planned on the host."
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/daedalus-mcu"
keywords = ["dataflow", "embedded", "no-std"]
categories = ["embedded", "no-std"]

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
default = ["f64"]
# Conversions to and from `f64` (parameters, constants and widening edges). Without it, `f64`
# soft-float stays out of tunable and loaded firmware: an `f64` parameter does not compile, a
# loaded plan converting to or from `f64` is rejected, and `f64` updates to `f32` parameters still
# convert (in integer arithmetic).
f64 = []
# `McuType` keys for `String` and `Vec<u8>` (heap payloads). The executor itself never allocates.
alloc = []
# The loaded-plan interpreter (`loaded::Interpreter`) and node library types.
loaded = []
# Chunked plan-blob receive (`loaded::receive`): framing with a CRC-32 per chunk, into a buffer
# or a flash partition.
receive = ["loaded"]
# `defmt::Format` for the error types.
defmt = ["dep:defmt"]

[dependencies]
daedalus-mcu-macros = { workspace = true }
defmt = { workspace = true, optional = true }
