[package]
name = "daedalus-core"
version = "3.0.0"
edition = "2024"
description = "Core types and shared utilities for the Daedalus dataflow stack."
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/daedalus-core"
readme = "README.md"
keywords = ["dataflow", "graph", "core"]
categories = ["concurrency", "data-structures"]

[lints]
workspace = true

[package.metadata.daedalus]
# Classifies every feature for the dynamic plugin build fingerprint (`daedalus::dylib`):
# boundary features change types that cross the plugin boundary and must match between host
# and plugin; host-only features only change host-side execution.
boundary-features = ["std", "metrics", "async-channels"]
host-only-features = []

[features]
default = ["std"]
# Host OS facilities: `std` locks and collections, clocks, threads. Without it the crate is
# `no_std` + `alloc` (see "Portability" in docs/development.md).
std = ["serde/std", "thiserror/std", "crossbeam-queue/std"]
metrics = []
async-channels = ["std", "tokio"]

[lib]
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
crossbeam-queue = { workspace = true }
spin = { workspace = true }
tokio = { workspace = true, optional = true }

# `Message` serializes its `Arc` payload: serde's `rc` needs `alloc::sync`, which only exists with
# compare-and-swap; elsewhere `portable-atomic-util` provides the impls.
[target.'cfg(target_has_atomic = "ptr")'.dependencies]
serde = { workspace = true, features = ["rc"] }

# Targets without 64-bit atomics (`thumbv7em`, ...): `portable-atomic`'s `AtomicU64`.
[target.'cfg(not(target_has_atomic = "64"))'.dependencies]
portable-atomic = { workspace = true }

# Targets without pointer-sized compare-and-swap (`thumbv6m`, `riscv32imc`): atomics, `spin` locks
# and `Arc` go through `portable-atomic`, whose `critical-section` implementation the final
# binary provides (see "Portability" in docs/development.md).
[target.'cfg(not(target_has_atomic = "ptr"))'.dependencies]
portable-atomic = { workspace = true, features = ["critical-section"] }
portable-atomic-util = { workspace = true, features = ["serde"] }
spin = { workspace = true, features = ["portable_atomic"] }

[dev-dependencies]
serde_json = { workspace = true }
proptest = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync", "time"] }
