[package]
name = "daedalus-ffi-rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Rust SDK for out-of-process Daedalus plugins: a persistent worker that speaks the FFI worker protocol."
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/daedalus-ffi-rust"
readme = "README.md"
keywords = ["ffi", "plugins", "worker"]
categories = ["api-bindings"]

[lints]
workspace = true

[features]
default = ["plugins"]
# Named by the `declare_plugin!` expansion (`#[cfg(feature = "plugins")]` in the calling crate). The
# SDK always uses the facade's plugin machinery; a plugin crate that uses this SDK declares the same
# feature.
plugins = []

[dependencies]
# The `#[node]` macros, the plugin registry and the runtime's handler dispatch. The `plugins`
# feature only: no engine, GPU or dynamic-library loading, and nothing from the stable in-process
# plugin ABI.
daedalus = { workspace = true, features = ["plugins"] }
daedalus-ffi-core = { workspace = true, features = ["integrity"] }
daedalus-ffi-host = { workspace = true, features = ["integrity"] }
serde_json = { workspace = true, features = ["std"] }
thiserror = { workspace = true, features = ["std"] }

[dev-dependencies]
daedalus-ffi-core = { workspace = true, features = ["conformance"] }
daedalus-ffi-host = { workspace = true, features = ["conformance"] }

# The conformance worker is this test binary (`harness = false`): the host starts it with
# `--worker <mode>` and it speaks the worker protocol on stdin and stdout, like the worker
# lifecycle fixture in `daedalus-ffi-host`.
[[test]]
name = "conformance"
harness = false
