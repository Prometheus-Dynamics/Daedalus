[package]
name = "daedalus-runtime"
version = "2.0.0"
edition = "2024"
description = "Runtime executor for Daedalus plans with backpressure and plugins."
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/daedalus-runtime"
readme = "README.md"
keywords = ["runtime", "dataflow", "graph"]
categories = ["concurrency"]

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[package.metadata.daedalus]
# Classifies every feature for the dynamic plugin build fingerprint (`daedalus::dylib`):
# boundary features change types that cross the plugin boundary and must match between host
# and plugin; host-only features only change host-side execution.
boundary-features = ["gpu", "gpu-mock", "plugins", "std"]
host-only-features = ["executor-pool", "lockfree-queues", "metrics", "snapshots", "threads"]

[features]
default = ["threads"]
# Lock backend: `parking_lot` with `std`, `spin` without (see `daedalus_runtime::sync`).
std = ["dep:parking_lot"]
# Worker threads: the parallel worker pool, stream workers (`spawn_continuous*`) and blocking
# waits. Without it `Parallel`/`Adaptive` run serially and the thread-only APIs do not exist.
threads = ["std"]
gpu = ["daedalus-gpu"]
gpu-mock = ["gpu", "daedalus-gpu/gpu-mock"]
executor-pool = ["threads", "rayon"]
lockfree-queues = ["crossbeam-queue"]
metrics = []
snapshots = []
plugins = []

[dependencies]
daedalus-planner = { workspace = true, features = ["std"] }
daedalus-registry = { workspace = true, features = ["std"] }
daedalus-transport = { workspace = true, features = ["std"] }
daedalus-gpu = { workspace = true, optional = true }
daedalus-data = { workspace = true, features = ["std", "json"] }
daedalus-core = { workspace = true, features = ["std"] }
libc = { workspace = true }
crossbeam-queue = { workspace = true, optional = true, features = ["std"] }
serde = { workspace = true, features = ["std"] }
thiserror = { workspace = true, features = ["std"] }
rayon = { workspace = true, optional = true }
smallvec = { workspace = true }
parking_lot = { workspace = true, optional = true }
spin = { workspace = true, features = ["lock_api", "mutex"] }
serde_json = { workspace = true, features = ["std"] }
tracing = { workspace = true, features = ["std"] }

# Targets without compare-and-swap: the `spin` lock backend over `portable-atomic`, as in the
# tier-1 crates (see `daedalus_runtime::sync`).
[target.'cfg(not(target_has_atomic = "ptr"))'.dependencies]
spin = { workspace = true, features = ["portable_atomic"] }

[dev-dependencies]
rand = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "executor_snapshot"
harness = false
required-features = ["threads"]
