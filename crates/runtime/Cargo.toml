[package]
name = "daedalus-runtime"
version = "2.0.0"
edition = "2024"
description = "Runtime executor for Daedalus plans with backpressure and plugins."
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/daedalus-runtime"
readme = "README.md"
keywords = ["runtime", "dataflow", "graph"]
categories = ["concurrency"]

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[package.metadata.daedalus]
# Classifies every feature for the dynamic plugin build fingerprint (`daedalus::dylib`):
# boundary features change types that cross the plugin boundary and must match between host
# and plugin; host-only features only change host-side execution.
boundary-features = ["gpu", "gpu-mock", "plugins", "std"]
host-only-features = ["executor-pool", "lockfree-queues", "metrics", "snapshots", "threads"]

[features]
default = ["threads"]
# Host OS facilities: `parking_lot` locks (`spin` without, see `daedalus_runtime::sync`), `std`
# hash maps, `Condvar` waits, Linux perf counters. Without it the crate is `no_std` + `alloc`
# (see "Portability" in docs/development.md).
std = [
    "dep:parking_lot",
    "dep:libc",
    "daedalus-core/std",
    "daedalus-data/std",
    "daedalus-planner/std",
    "daedalus-registry/std",
    "daedalus-transport/std",
    "crossbeam-queue?/std",
    "serde/std",
    "serde_json/std",
    "thiserror/std",
    "tracing/std",
]
# Worker threads: the parallel worker pool, stream workers (`spawn_continuous*`) and blocking
# waits. Without it `Parallel`/`Adaptive` run serially and the thread-only APIs do not exist.
threads = ["std"]
gpu = ["std", "daedalus-gpu"]
gpu-mock = ["gpu", "daedalus-gpu/gpu-mock"]
executor-pool = ["threads", "rayon"]
lockfree-queues = ["crossbeam-queue"]
metrics = []
snapshots = []
plugins = []

[dependencies]
daedalus-planner = { workspace = true }
daedalus-registry = { workspace = true }
daedalus-transport = { workspace = true }
daedalus-gpu = { workspace = true, optional = true }
daedalus-data = { workspace = true, features = ["json"] }
daedalus-core = { workspace = true }
crossbeam-queue = { workspace = true, optional = true }
hashbrown = { workspace = true, features = ["serde"] }
serde = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true, optional = true }
smallvec = { workspace = true }
parking_lot = { workspace = true, optional = true }
spin = { workspace = true, features = ["lock_api", "mutex"] }
serde_json = { workspace = true }
tracing = { workspace = true }

# Hardware perf counters (`RuntimeDebugConfig::node_perf_counters`), Linux with `std` only.
[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true, optional = true }

[dev-dependencies]
rand = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "executor_snapshot"
harness = false
required-features = ["threads"]
