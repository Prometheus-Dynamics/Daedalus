[package]
name = "daedalus-frame-bench"
version = "3.0.0"
edition.workspace = true
rust-version.workspace = true
description = "Frame-path overhead harness for host-driven Daedalus graphs: synthetic daedalus:frame sources (memfd, dma-heap) and a no-op stage chain."
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
daedalus = { workspace = true, features = ["engine", "plugins", "threads", "alloc-probe"] }
libc = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "frame_chain"
harness = false
