[package]
name = "daedalus-frame-bench"
version = "3.0.1-dev"
edition.workspace = true
rust-version.workspace = true
description = "Frame-path overhead harness for host-driven Daedalus graphs: synthetic daedalus:frame sources (memfd, dma-heap) and a no-op stage chain."
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# `metrics` and `tracing` are daedalus defaults and the live engine runs them: without `metrics`
# the Timing level compiles out, and `tracing` adds the per-node spans the runtime records.
daedalus = { workspace = true, features = ["engine", "plugins", "threads", "alloc-probe", "metrics", "tracing"] }
libc = { workspace = true }
serde = { workspace = true }

# dma-buf allocation, CPU access and mapping (`dma`), as `crates/gpu` takes them.
[target.'cfg(target_os = "linux")'.dependencies]
lemnos-linux = { workspace = true, features = ["dma"] }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "frame_chain"
harness = false

[[bench]]
name = "const_ports"
harness = false
